[package]
name = "rawalchemy_fotlab"
version = "0.1.0"
edition = "2021"
publish = false
description = "FotLab cxx bridge into the RawAlchemyCpp grading engine (FOTLAB-RAWLER-000006)"

[lib]
name = "rawalchemy_fotlab"
crate-type = ["rlib", "staticlib"]
path = "src/lib.rs"

[dependencies]
cxx = "1"

[build-dependencies]
cxx-build = "1"
cmake = "0.1"
