[package]
name = "rawler_fotlab"
version = "0.1.0"
edition = "2021"
publish = false
description = "FotLab native binding over the upstream rawler crate (external/dnglab)"

# First-party native binding. This is the ONLY native library we ship and it is the
# only one that carries a FotLab name (`librawler_fotlab.so`). Upstream `rawler` is
# consumed as a *path* dependency into `external/dnglab/rawler`, so we compile the
# pinned submodule source directly and never modify it (`FOTLAB-NATIVE-000001` R4).
#
# This crate deliberately lives OUTSIDE the dnglab Cargo workspace: the upstream
# workspace is read-only, so it must not list us as a member. We are a standalone
# workspace whose only third-party source is reached through the path dependency.

[lib]
name = "rawler_fotlab"
crate-type = ["cdylib"]
path = "src/lib.rs"

[features]
# Enables the `uniffi-bindgen` binary below. Kept out of the default build so the
# shipped cdylib does not carry the bindgen CLI (clap) with it.
cli = ["uniffi/cli"]
# Wires the rawler develop pipeline straight into the rawalchemy grading engine
# (`rawalchemy_fotlab` cxx bridge). ON by default: the shipped `librawler_fotlab.so`
# links the grading static lib, so the native build needs the C++ toolchain + the
# RawAlchemyCpp submodule + (for Android) the NDK cmake toolchain — `rawalchemy_fotlab`
# build.rs passes it through. Slim CI builds can opt out with `--no-default-features`.
rawalchemy = ["dep:rawalchemy_fotlab"]

# Default feature set for the shipped library.
default = ["rawalchemy"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]

[dependencies]
rawler = { path = "../../../../../external/dnglab/rawler" }
thiserror = "2.0"
uniffi = "0.28"
# Data parallelism for our own per-pixel stages (exposure / calibrate / PNG expansion /
# crop), which upstream rawler cannot parallelise for us — it only parallelises its own
# internals (`demosaic`). Pinned to the same major version rawler uses so both share a
# single rayon instance and therefore one worker pool per process
# (`rules/REVIEW/detail/OPTIMZ-PERFRM-000007.md`).
rayon = "1"
# Same crate + major as rawler's own `log = "0.4"`, so the demosaic fallback
# warnings below land in the same logger as upstream's messages instead of
# splitting the log across two versions (a no-op crate-dedup concern, but it
# also keeps `Cargo.lock` unchanged). Used only to *state* a fallback: when a
# RAWTRP pick cannot run on the image's CFA we silently produce the CFA default,
# and this is the only trace of it (`FOTLAB-NATIVE-000004` D4).
log = "0.4"
# PNG only: the binding emits PNG (R3 of FOTLAB-STUDIO-000001). Disabling default
# features avoids pulling every image format the `image` crate can decode.
image = { version = "0.25", default-features = false, features = ["png"] }
# Direct Rust→cxx handoff into the rawalchemy grading engine. Optional + feature-
# gated so the default rawler build stays pure-Rust (see `rawalchemy` feature).
# The crate lives under binding/cxx/ (the whole bridge is confined there), so the
# path crosses from rust/ to cxx/ — this is NOT a sibling of rawler_fotlab.
rawalchemy_fotlab = { path = "../../cxx/rawalchemy_fotlab", optional = true }
# First-party pure-Rust port of the RawTherapee demosaic kernels (Bayer + X-Trans).
# A sibling crate under app/src/binding/rust/, consumed as a path dependency like
# `rawler` itself; it is pure Rust (no C++, no librtengine, no submodule hook) and
# returns its result as `rawler`'s own `Intermediate::ThreeColor`, so the develop
# pipeline downstream of demosaic does not change
# (rules/DESIGN/detail/FOTLAB-NATIVE-000004.md).
rawtrp_demos = { path = "../rawtrp_demos" }
rawtrp_correct = { path = "../rawtrp_correct" }
