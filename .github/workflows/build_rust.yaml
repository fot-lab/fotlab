# Reusable workflow: builds the rawler_fotlab native library (.so + UniFFI Kotlin bindings)
# and uploads them as one artifact consumed by the Android (build_gradle.yaml) job.
#
# Source of truth for the binding crate is our own tree:
#   app/src/binding/rust/rawler_fotlab/              — the first-party Rust crate
#   app/src/binding/kotlin/io/github/fotlab/fotlab_rawler — the hand-written Kotlin facade
#
# The crate is a standalone workspace that reaches the upstream source through a *path*
# dependency (`external/dnglab/rawler`), so we compile the pinned submodule directly and
# never modify it (FOTLAB-NATIVE-000001 R4 — upstream is read-only). The generator ships
# as a binary inside the crate, guaranteeing generator/runtime version parity.
# See rules/ACTION.md (Native Job Scope) and FOTLAB-STUDIO-000001.

name: Rust Native Build

on:
  workflow_call:
    inputs:
      submodules:
        description: Check out git submodules under external/ recursively (the path dependency lives in external/dnglab).
        required: false
        type: boolean
        default: true
      ndk-version:
        description: Android NDK version to build against.
        required: false
        type: string
        default: '28.2.13676358'
      min-api:
        description: Minimum Android API level the native library is built for.
        required: false
        type: string
        default: '26'
    outputs:
      artifact-name:
        description: Name of the uploaded native artifact (jniLibs + Kotlin bindings).
        value: rawler_fotlab

permissions:
  contents: read

jobs:
  build:
    name: Build rawler_fotlab (.so + Kotlin bindings)
    runs-on: ubuntu-26.04
    env:
      NDK_VERSION: ${{ inputs.ndk-version }}
      MIN_API: ${{ inputs.min-api }}
      CRATE_DIR: app/src/binding/rust/rawler_fotlab
      ANDROID_API: '36'
      ANDROID_BUILD_TOOLS: '36.0.0'
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: ${{ inputs.submodules && 'recursive' || 'false' }}

      # Resolve the runner's Android SDK root in bash and publish it back to the
      # GitHub env. On the ubuntu-26.04 preview images the SDK root is exported
      # only as an inherited PROCESS variable: ${{ env.ANDROID_HOME }} evaluates
      # empty in workflow expressions, and an empty `env:` on a composite step
      # silently overrides the inherited value inside bash. Falling back to the
      # well-known image paths keeps this working on self-hosted runners too.
      - name: Locate Android SDK
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_HOME:-}" ] || [ ! -d "$ANDROID_HOME" ]; then
            for candidate in /usr/local/lib/android/sdk /home/runner/.android/sdk "$HOME/.android/sdk" "$HOME/Android/Sdk"; do
              if [ -d "$candidate" ]; then ANDROID_HOME="$candidate"; break; fi
            done
          fi
          : "${ANDROID_HOME:?No Android SDK root found on this runner}"
          echo "Using ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
        shell: bash

      - name: Install JDK
        uses: ./.github/actions/install_jdk
        with:
          java-version: '17'
          distribution: temurin

      - name: Install Android SDK
        uses: ./.github/actions/install_sdk
        with:
          android-home: ${{ env.ANDROID_HOME }}
          api-level: ${{ env.ANDROID_API }}
          build-tools: ${{ env.ANDROID_BUILD_TOOLS }}

      - name: Install NDK
        uses: ./.github/actions/install_ndk
        with:
          android-home: ${{ env.ANDROID_HOME }}
          ndk-version: ${{ env.NDK_VERSION }}

      # cargo-ndk accepts either variable; export both so it cannot miss the NDK.
      - name: Export NDK path
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
        shell: bash

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      # Publish the pinned dnglab submodule SHA as an env var so it lands in the
      # VOLATILE tail of the rust-cache key (see the cache layering note below),
      # rather than in a mid-chain custom key that blocks prefix fallback.
      - name: Resolve dnglab submodule SHA
        run: echo "DNGLAB_SHA=$(git -C external/dnglab rev-parse HEAD)" >> "$GITHUB_ENV"
        shell: bash

      # Rust build cache — two logical layers over one rust-cache archive:
      #
      #   Stable layer   $CARGO_HOME/registry + /git + /bin (crates.io sources and
      #                  the cargo-ndk binary). Changes only when dependency
      #                  manifests/lockfiles change; rust-cache hashes that into the
      #                  lockfile segment of the key.
      #   Volatile layer <crate>/target — rawler is a path dep under external/, so
      #                  its artifacts change with the dnglab submodule SHA. The SHA
      #                  is passed through env-vars so it is folded into the trailing
      #                  segment of the key.
      #
      # rust-cache restores with progressively shortened prefix keys. Because the
      # SHA sits at the TAIL, a submodule bump still matches the previous run at the
      # lockfile prefix: the stable dependency layer (and stale rlibs cargo can
      # re-fingerprint) is restored, while cargo rebuilds only rawler/our crate.
      # Putting the SHA in `key` instead would sit before the lockfile segment and
      # invalidate the dependency layer on every bump for no reason.
      # NDK_VERSION/MIN_API are env-vars too — they change native compile flags.
      #
      # The NDK itself is a separate cache layer: preinstalled on the runner image,
      # and the fallback install_ndk cache is keyed by NDK version only, so neither
      # our code nor rust rebuilds ever invalidate it.
      #
      # workspaces — the crate is a standalone workspace OUTSIDE the repo root, so
      #              the default ". -> target" would cache nothing; point at it.
      # cache-all-crates — rawler is a path *dependency* (not a workspace member);
      #              this also keeps our own tiny crate's artifacts.
      # Must run AFTER Install Rust (the action runs `cargo metadata`) and BEFORE
      # any cargo invocation.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src/binding/rust/rawler_fotlab -> target
          cache-all-crates: true
          env-vars: NDK_VERSION MIN_API DNGLAB_SHA

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
        shell: bash

      # `cargo ndk -o <dir>` writes <dir>/<abi>/librawler_fotlab.so directly in the
      # jniLibs layout Gradle expects, so no ABI->triple mapping is needed here.
      - name: Build librawler_fotlab.so for all ABIs
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/native-artifacts"
          mkdir -p "$OUT/jniLibs" "$OUT/kotlin"
          cd "$CRATE_DIR"
          cargo ndk --platform "$MIN_API" \
            --target arm64-v8a --target armeabi-v7a --target x86 --target x86_64 \
            -o "$OUT/jniLibs" \
            build --release
        shell: bash

      # The generator is this crate's own `uniffi-bindgen` bin (`--features cli`), so its
      # version can never drift from the `uniffi` runtime linked into the .so. It reads
      # uniffi.toml (Kotlin `package_name`) from the crate directory via `cargo metadata`,
      # which is why we `cd` into the crate first. `--library` is mandatory for the
      # proc-macro interface (#[uniffi::export], no .udl): bindgen then parses the
      # UNIFFI_META_* symbols straight out of the ELF (goblin, no dlopen), so the
      # cross-compiled Android .so works on the x86_64 runner without a host rebuild.
      # Kotlin output is ABI-independent, so one ABI's .so is enough.
      - name: Generate Kotlin bindings
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/native-artifacts"
          cd "$CRATE_DIR"
          cargo run --features cli --bin uniffi-bindgen -- \
            generate \
            --library \
            --language kotlin \
            --out-dir "$OUT/kotlin" \
            --no-format \
            "$OUT/jniLibs/arm64-v8a/librawler_fotlab.so"
        shell: bash

      - name: Upload native artifact
        uses: actions/upload-artifact@v7
        with:
          name: rawler_fotlab
          path: native-artifacts/
          retention-days: 7
          if-no-files-found: error
