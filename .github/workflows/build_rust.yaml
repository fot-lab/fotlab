# Reusable workflow: builds the rawler_fotlab native library (.so + UniFFI Kotlin bindings)
# and uploads them as one artifact consumed by the Android (build_gradle.yaml) job.
#
# Source of truth for the binding crate is our own tree:
#   app/src/binding/rust/rawler_fotlab/              — the first-party Rust crate
#   app/src/binding/kotlin/io/github/fotlab/fotlab_rawler — the hand-written Kotlin facade
#
# The crate is a standalone workspace that reaches the upstream source through a *path*
# dependency (`external/dnglab/rawler`), so we compile the pinned submodule directly and
# never modify it (FOTLAB-NATIVE-000001 R4 — upstream is read-only). The generator ships
# as a binary inside the crate, guaranteeing generator/runtime version parity.
# See rules/ACTION.md (Native Job Scope) and FOTLAB-STUDIO-000001.

name: Rust Native Build

on:
  workflow_call:
    inputs:
      submodules:
        description: Check out git submodules under external/ recursively (the path dependency lives in external/dnglab).
        required: false
        type: boolean
        default: true
      ndk-version:
        description: Android NDK version to build against.
        required: false
        type: string
        default: '28.2.13676358'
      min-api:
        description: Minimum Android API level the native library is built for.
        required: false
        type: string
        default: '26'
    outputs:
      artifact-name:
        description: Name of the uploaded native artifact (jniLibs + Kotlin bindings).
        value: rawler_fotlab

permissions:
  contents: read

jobs:
  build:
    name: Build rawler_fotlab (.so + Kotlin bindings)
    runs-on: ubuntu-26.04
    env:
      NDK_VERSION: ${{ inputs.ndk-version }}
      MIN_API: ${{ inputs.min-api }}
      CRATE_DIR: app/src/binding/rust/rawler_fotlab
      ANDROID_API: '36'
      ANDROID_BUILD_TOOLS: '36.0.0'
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: ${{ inputs.submodules && 'recursive' || 'false' }}

      - name: Locate Android SDK
        uses: ./.github/actions/locate_sdk

      - name: Install JDK
        uses: ./.github/actions/install_jdk
        with:
          java-version: '17'
          distribution: temurin

      - name: Install Android SDK
        uses: ./.github/actions/install_sdk
        with:
          android-home: ${{ env.ANDROID_HOME }}
          api-level: ${{ env.ANDROID_API }}
          build-tools: ${{ env.ANDROID_BUILD_TOOLS }}

      - name: Install NDK
        uses: ./.github/actions/install_ndk
        with:
          android-home: ${{ env.ANDROID_HOME }}
          ndk-version: ${{ env.NDK_VERSION }}

      # cargo-ndk accepts either variable; export both so it cannot miss the NDK.
      - name: Export NDK path
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
        shell: bash

      # rustup keeps the toolchain in ~/.rustup, which Swatinem/rust-cache does NOT
      # cover — it caches $CARGO_HOME and target/ only. Without this the
      # `dtolnay/rust-toolchain` step below re-fetches the host toolchain plus the four
      # Android target std libraries from static.rust-lang.org on every run
      # (`info: syncing channel updates` + `info: downloading 4 components`, ~250 MB).
      #
      # The save key is deliberately unknown at restore time: a constant key cannot
      # work here, because actions/cache never re-saves an entry it restored, so the
      # archive would freeze at whatever `stable` was the day it was created and every
      # later run would re-download the difference forever. So we restore by PREFIX and
      # then save under the key of the toolchain we actually ended up with
      # (`<os>-rustup-<rustc version>`): restoring an archive of the same release is a
      # no-op, and a channel bump mints one new entry while the previous one becomes
      # dead weight for the quota-hygiene pass (rules/ACTION.md).
      #
      # Must run BEFORE `Install Rust`: the whole point is to have the components on
      # disk before rustup decides what it still has to download.
      - name: Restore Rust toolchain cache
        id: rustup-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.rustup
          key: ${{ runner.os }}-rustup-current
          restore-keys: |
            ${{ runner.os }}-rustup-

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Resolve Rust toolchain cache key
        id: rustup-key
        run: |
          set -euo pipefail
          echo "key=${{ runner.os }}-rustup-$(rustc -vV | sed -n 's/^release: //p')" >> "$GITHUB_OUTPUT"
        shell: bash

      # Skipped when the restored archive already IS this toolchain (same key) — saving
      # it again would merely collide with an existing entry. Saved here, immediately
      # after the install and before anything that can fail, so a later build failure
      # cannot throw away a toolchain download that already succeeded.
      - name: Save Rust toolchain cache
        if: steps.rustup-key.outputs.key != steps.rustup-cache.outputs.cache-matched-key
        uses: actions/cache/save@v6
        with:
          path: ~/.rustup
          key: ${{ steps.rustup-key.outputs.key }}

      # Publish the pinned dnglab submodule SHA as an env var so it lands in the
      # VOLATILE tail of the rust-cache key (see the cache layering note below),
      # rather than in a mid-chain custom key that blocks prefix fallback.
      - name: Resolve dnglab submodule SHA
        run: echo "DNGLAB_SHA=$(git -C external/dnglab rev-parse HEAD)" >> "$GITHUB_ENV"
        shell: bash

      # Rust build cache — two logical layers over one rust-cache archive:
      #
      #   Stable layer   $CARGO_HOME/registry + /git + /bin (crates.io sources and
      #                  the cargo-ndk binary). Changes only when dependency
      #                  manifests/lockfiles change; rust-cache hashes that into the
      #                  lockfile segment of the key.
      #   Volatile layer <crate>/target — rawler is a path dep under external/, so
      #                  its artifacts change with the dnglab submodule SHA. The SHA
      #                  is passed through env-vars so it is folded into the trailing
      #                  segment of the key.
      #
      # rust-cache restores with progressively shortened prefix keys. Because the
      # SHA sits at the TAIL, a submodule bump still matches the previous run at the
      # lockfile prefix: the stable dependency layer (and stale rlibs cargo can
      # re-fingerprint) is restored, while cargo rebuilds only rawler/our crate.
      # Putting the SHA in `key` instead would sit before the lockfile segment and
      # invalidate the dependency layer on every bump for no reason.
      # NDK_VERSION/MIN_API are env-vars too — they change native compile flags.
      #
      # The NDK itself is a separate cache layer: preinstalled on the runner image,
      # and the fallback install_ndk cache is keyed by NDK version only, so neither
      # our code nor rust rebuilds ever invalidate it.
      #
      # workspaces — the crate is a standalone workspace OUTSIDE the repo root, so
      #              the default ". -> target" would cache nothing; point at it.
      # cache-all-crates — rawler is a path *dependency* (not a workspace member);
      #              this also keeps our own tiny crate's artifacts.
      # Must run AFTER Install Rust (the action runs `cargo metadata`) and BEFORE
      # any cargo invocation.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src/binding/rust/rawler_fotlab -> target
          cache-all-crates: true
          env-vars: NDK_VERSION MIN_API DNGLAB_SHA

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
        shell: bash

      # `cargo ndk -o <dir>` writes <dir>/<abi>/librawler_fotlab.so directly in the
      # jniLibs layout Gradle expects, so no ABI->triple mapping is needed here.
      # The rawalchemy grading build (rawalchemy_fotlab build.rs) drives cmake to
      # compile the grading-only subset of RawAlchemyCpp, so the native job now needs
      # a cmake binary on PATH. Install it only if missing (ubuntu-26.04 ships it).
      - name: Install cmake (rawalchemy grading build needs it)
        run: |
          if ! command -v cmake >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y cmake
          fi
        shell: bash

      - name: Build librawler_fotlab.so for all ABIs
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/native-artifacts"
          mkdir -p "$OUT/jniLibs" "$OUT/kotlin"
          cd "$CRATE_DIR"
          cargo ndk --platform "$MIN_API" \
            --target arm64-v8a --target armeabi-v7a --target x86 --target x86_64 \
            -o "$OUT/jniLibs" \
            build --release
        shell: bash

      # librawler_fotlab.so carries a DT_NEEDED on libc++_shared.so (the cxx
      # link-cplusplus default + rawalchemy_fotlab/build.rs dylib=c++; the cmake
      # subset builds with -DANDROID_STL=c++_shared). AGP packages hand-produced
      # jniLibs verbatim and never injects the STL itself (that only happens for
      # externalNativeBuild projects), so without this step the app dies at
      # loadLibrary with `dlopen failed: library "libc++_shared.so" not found`.
      # Copy the NDK's per-ABI shared STL next to our .so; both downstream jobs
      # (build_gradle / smoke_emulator) cp the whole jniLibs tree, so the APK and
      # the smoke test pick it up automatically. NDK r27+ stores it in the
      # sysroot; older NDKs under sources/cxx-stl — try both.
      - name: Bundle libc++_shared.so into jniLibs
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/native-artifacts/jniLibs"
          SYSROOT_LIB="$(echo "$ANDROID_NDK_HOME"/toolchains/llvm/prebuilt/*/sysroot/usr/lib)"
          declare -A TRIPLES=(
            [arm64-v8a]=aarch64-linux-android
            [armeabi-v7a]=arm-linux-androideabi
            [x86]=i686-linux-android
            [x86_64]=x86_64-linux-android
          )
          for abi in "${!TRIPLES[@]}"; do
            src="$SYSROOT_LIB/${TRIPLES[$abi]}/libc++_shared.so"
            if [ ! -f "$src" ]; then
              src="$ANDROID_NDK_HOME/sources/cxx-stl/llvm-libc++/libs/$abi/libc++_shared.so"
            fi
            if [ ! -f "$src" ]; then
              echo "::error::libc++_shared.so for $abi not found under $ANDROID_NDK_HOME"
              exit 1
            fi
            cp "$src" "$OUT/$abi/libc++_shared.so"
            echo "bundled $abi libc++_shared.so <- $src"
          done
        shell: bash

      # RawAlchemyCpp's grading loops are now compiled with OpenMP (RA_USE_OPENMP).
      # `cpp/CMakeLists.txt` prefers the STATIC runtime, in which case there is nothing
      # to bundle and this step is a no-op. When only the shared runtime is available it
      # records `bundle=<abs path>` in `openmp-link.txt`, and the .so has to sit next to
      # librawler_fotlab.so or the app dies at loadLibrary with
      # `dlopen failed: library "libomp.so" not found` — the same failure mode as the
      # libc++_shared.so step above. The path is resolved by CMake (which knows the NDK
      # layout), so we read it back rather than guessing at it in bash.
      - name: Bundle libomp.so into jniLibs (only when OpenMP links a shared runtime)
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/native-artifacts/jniLibs"
          # Rust target triples (NOT the GNU sysroot triples used above).
          declare -A RUST_TRIPLES=(
            [arm64-v8a]=aarch64-linux-android
            [armeabi-v7a]=armv7-linux-androideabi
            [x86]=i686-linux-android
            [x86_64]=x86_64-linux-android
          )
          for abi in "${!RUST_TRIPLES[@]}"; do
            triple="${RUST_TRIPLES[$abi]}"
            info=$(find "$CRATE_DIR/target/$triple/release/build" -name openmp-link.txt -print -quit 2>/dev/null || true)
            [ -n "$info" ] || continue
            # `|| true`: `head -n1` closes the pipe early, and with `pipefail` the
            # resulting SIGPIPE from sed would otherwise abort the whole step.
            bundle=$(sed -n 's/^bundle=//p' "$info" | head -n1 || true)
            [ -n "$bundle" ] || continue
            if [ ! -f "$bundle" ]; then
              echo "::error::OpenMP shared runtime recorded at $bundle is missing for $abi"
              exit 1
            fi
            cp "$bundle" "$OUT/$abi/libomp.so"
            echo "bundled $abi libomp.so <- $bundle"
          done
        shell: bash

      # The generator is this crate's own `uniffi-bindgen` bin (`--features cli`), so its
      # version can never drift from the `uniffi` runtime linked into the .so. It reads
      # uniffi.toml (Kotlin `package_name`) from the crate directory via `cargo metadata`,
      # which is why we `cd` into the crate first. `--library` is mandatory for the
      # proc-macro interface (#[uniffi::export], no .udl): bindgen then parses the
      # UNIFFI_META_* symbols straight out of the ELF (goblin, no dlopen), so the
      # cross-compiled Android .so works on the x86_64 runner without a host rebuild.
      # Kotlin output is ABI-independent, so one ABI's .so is enough.
      - name: Generate Kotlin bindings
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/native-artifacts"
          cd "$CRATE_DIR"
          cargo run --features cli --bin uniffi-bindgen -- \
            generate \
            --library \
            --language kotlin \
            --out-dir "$OUT/kotlin" \
            --no-format \
            "$OUT/jniLibs/arm64-v8a/librawler_fotlab.so"
        shell: bash

      - name: Upload native artifact
        uses: actions/upload-artifact@v7
        with:
          name: rawler_fotlab
          path: native-artifacts/
          retention-days: 7
          if-no-files-found: error
