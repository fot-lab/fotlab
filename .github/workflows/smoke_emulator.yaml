# Reusable workflow: smoke-tests the debug build on Android emulators.
#
# Called by build.yaml as the sibling of release_github.yaml, and only for a
# NON-release run: a release is verified by publishing the APK, not by booting an
# emulator.
#
# The instrumented suite is split into FOUR independent, parallel shard jobs so a
# slow or wedged slice never blocks the other three, and the wall-clock budget is
# the slowest shard instead of the whole suite:
#
#   test_app_smoke       MainActivity reaches RESUMED; zoom/pan gesture tests.
#                        No RAW corpus, no LUT — the fastest signal that the app boots.
#   test_image_loader    PNG end-to-end import/viewer/studio route; native
#                        identify/decode boundary calls; the five RAW brands
#                        opening in Studio through rawler (load + as-shot render).
#   test_image_develop   native develop entry boundary; five RAW brands through
#                        the demosaic menu + the full algorithm/exposure redevelop
#                        proof. The HEAVY shard (36..50 MP software demosaics).
#   test_image_alchemy   log/grade enumeration; boost+log and grade-bar journeys;
#                        the Panasonic V-Log + downloaded .cube LUT journey and the
#                        SAF LUT-picker contract. Needs the LUT fixture.
#
# Each shard passes an AndroidJUnitRunner `-e class` list to
# connectedDebugAndroidTest via -PsmokeTestFilter (mapped in app/build.gradle.kts).
# The membership of every @Test lives in one place: the TEST_FILTER env below.
#
# A fifth job, prep-emulator, warms the two big caches (the AVD+snapshot and the
# ~250 MB RAW corpus) exactly once; all four shards `needs: prep-emulator` and
# only ever RESTORE them. This keeps cache writes off the parallel jobs, so N
# shards can never race saving the same cache key.
#
# Two prerequisites the jobs cannot skip, both learned the hard way:
#   * KVM must be made accessible BEFORE the emulator starts. /dev/kvm exists on the
#     image but belongs to group `kvm`, which the runner user is not in; without the
#     udev rule below the emulator silently falls back to -accel off and its adb
#     daemon never comes up.
#   * the AVD and the emulator's SDK packages (system image, emulator, build-tools)
#     must be cached TOGETHER — an AVD with no system image cannot boot.
#
# See rules/ACTION.md (Test Strategy, CI cache layers) and FOTLAB-CRASH-000001.

name: Emulator Smoke Test

on:
  workflow_call:
    inputs:
      native-artifact-name:
        description: >
          Name of the native artifact (librawler_fotlab.so + Kotlin bindings) to download and
          place before Gradle. Empty means skip native placement (no rawler_fotlab lib).
        required: false
        type: string
        default: ''
      api-level:
        description: API level of the AVD's system image.
        required: false
        type: string
        default: '36'
      target:
        description: System-image flavour (google_apis, default, aosp_atd, ...).
        required: false
        type: string
        default: google_apis
      arch:
        description: >
          AVD architecture. Must be an ABI present in librawler_fotlab.so — x86_64 for the
          hosted ubuntu runners.
        required: false
        type: string
        default: x86_64
      log-artifact-name:
        description: Base name of the uploaded per-shard failure log artifacts (a -<shard> suffix is appended). Empty means no log artifact.
        required: false
        type: string
        default: ''
      log-retention-days:
        description: Retention of the failure log artifacts, in days.
        required: false
        type: number
        default: 7

permissions:
  contents: read

jobs:
  # Warms the emulator cache (AVD + quick-boot snapshot + the SDK packages it
  # boots) and the RAW corpus cache exactly once. The snapshot is generated and
  # SAVED before any APK is ever installed, so the cached emulator is pristine and
  # stays valid for every shard and every later build. All four shards start only
  # after this finishes, so their cache restores are warm and their saves are
  # unnecessary (a shard that hits an evicted cache creates the AVD locally but
  # never persists it — see the shard action's cold fallback).
  prep-emulator:
    name: Smoke prep (AVD + RAW corpus)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      ANDROID_API: '36'
      ANDROID_BUILD_TOOLS: '36.0.0'
      EMULATOR_OPTIONS: '-no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 4096'
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install JDK
        uses: ./.github/actions/install_jdk
        with:
          java-version: '17'
          distribution: temurin

      - name: Locate Android SDK
        uses: ./.github/actions/locate_sdk

      - name: Install Android SDK
        uses: ./.github/actions/install_sdk
        with:
          android-home: ${{ env.ANDROID_HOME }}
          api-level: ${{ env.ANDROID_API }}
          build-tools: ${{ env.ANDROID_BUILD_TOOLS }}

      - name: Enable KVM
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
        shell: bash

      # -------- emulator cache (AVD + snapshot + its SDK packages, one key) --------
      - name: Restore emulator cache
        id: emulator-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
            ${{ env.ANDROID_HOME }}/system-images
            ${{ env.ANDROID_HOME }}/emulator
            ${{ env.ANDROID_HOME }}/build-tools
          key: ${{ runner.os }}-emulator-${{ inputs.api-level }}-${{ inputs.target }}-${{ inputs.arch }}

      - name: Create AVD and generate a snapshot for caching
        if: steps.emulator-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.api-level }}
          target: ${{ inputs.target }}
          arch: ${{ inputs.arch }}
          force-avd-creation: false
          emulator-options: ${{ env.EMULATOR_OPTIONS }}
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Save emulator cache
        if: steps.emulator-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
            ${{ env.ANDROID_HOME }}/system-images
            ${{ env.ANDROID_HOME }}/emulator
            ${{ env.ANDROID_HOME }}/build-tools
          key: ${{ runner.os }}-emulator-${{ inputs.api-level }}-${{ inputs.target }}-${{ inputs.arch }}

      # -------- RAW corpus (fot-lab/rawdb) — immutable, cached once --------
      - name: Restore RAW sample cache
        id: raw-samples-cache
        uses: actions/cache/restore@v6
        with:
          path: raw-samples
          key: rawdb-samples-v1

      - name: Download RAW samples
        if: steps.raw-samples-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p raw-samples
          base="https://github.com/fot-lab/rawdb/raw/refs/heads/samples"
          curl -fL --retry 3 --retry-delay 5 \
            -o "raw-samples/Canon EOS 5DS_ISO_1000_RAW.CR2" \
            "$base/Canon/EOS%205DS/Canon%20EOS%205DS_ISO_1000_RAW.CR2"
          curl -fL --retry 3 --retry-delay 5 \
            -o "raw-samples/ILCE-7R_ISO_50_14bits_Sony ARW Compressed.ARW" \
            "$base/Sony/ILCE-7R/ILCE-7R_ISO_50_14bits_Sony%20ARW%20Compressed.ARW"
          curl -fL --retry 3 --retry-delay 5 \
            -o "raw-samples/ILCE-7RM2_ISO_100_14bits_Compressed RAW.ARW" \
            "$base/Sony/ILCE-7RM2/ILCE-7RM2_ISO_100_14bits_Compressed%20RAW.ARW"
          curl -fL --retry 3 --retry-delay 5 \
            -o "raw-samples/NIKON D850_Large_ISO_64_14bits_Lossless.NEF" \
            "$base/Nikon/D850/NIKON%20D850_Large_ISO_64_14bits_Lossless.NEF"
          curl -fL --retry 3 --retry-delay 5 \
            -o "raw-samples/DC-S1R_ISO_100_6fmt_8368x5584.RW2" \
            "$base/Panasonic/DC-S1R/DC-S1R_ISO_100_6fmt_8368x5584.RW2"
          ls -l raw-samples
        shell: bash

      - name: Save RAW sample cache
        if: steps.raw-samples-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: raw-samples
          key: rawdb-samples-v1

  # -------- shard 1: app shell + gestures (7 tests, no corpus) --------
  test-app-smoke:
    name: Smoke / test_app_smoke
    needs: [prep-emulator]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      # Whole classes: app boot + the zoomable/gesture suite.
      TEST_FILTER: >-
        io.github.fotlab.fotlab.smoke.MainActivitySmokeTest
    steps:
      # Must check out BEFORE invoking the local composite action: the runner reads
      # .github/actions/emulator_smoke_shard/action.yml from disk at expansion time,
      # so a checkout that only happens INSIDE the action is one step too late.
      - name: Check out
        uses: actions/checkout@v7

      - name: Run app smoke shard
        uses: ./.github/actions/emulator_smoke_shard
        with:
          api-level: ${{ inputs.api-level }}
          target: ${{ inputs.target }}
          arch: ${{ inputs.arch }}
          native-artifact-name: ${{ inputs.native-artifact-name }}
          shard: app
          test-filter: ${{ env.TEST_FILTER }}
          need-raw: 'false'
          need-lut: 'false'
          test-timeout-minutes: '20'
          log-artifact-name: ${{ inputs.log-artifact-name }}
          log-retention-days: ${{ inputs.log-retention-days }}

  # -------- shard 2: identify / decode / load + open routes (16 tests) --------
  test-image-loader:
    name: Smoke / test_image_loader
    needs: [prep-emulator]
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      # PNG end-to-end; native sniff/decode boundary (incl. the .so load sanity and
      # exception surfacing); the open route for the PNG control and all five RAW
      # brands (load + as-shot render), plus the grade-bar hidden-on-PNG assertion.
      TEST_FILTER: >-
        io.github.fotlab.fotlab.smoke.RawlerNativeSmokeTest#nativeLibraryIsLoadableOnThisAbi+identifyRejectsNonRawBytes+identifyOnPngSurvives+decodeOfNonRawBytesReturnsNull+decodeOfPngSurvives+identifyCallSurfacesJvmExceptions,
        io.github.fotlab.fotlab.smoke.RawRoutingTest#pngOpensInStudioThroughCoil+canonCr2OpensInStudioThroughRawler+sonyIlce7rArwOpensInStudioThroughRawler+sonyIlce7rm2ArwOpensInStudioThroughRawler+nikonD850NefOpensInStudioThroughRawler+panasonicDcS1rRw2OpensInStudioThroughRawler
    steps:
      # Checkout must precede the local action — see the test-app-smoke shard above.
      - name: Check out
        uses: actions/checkout@v7

      - name: Run image loader shard
        uses: ./.github/actions/emulator_smoke_shard
        with:
          api-level: ${{ inputs.api-level }}
          target: ${{ inputs.target }}
          arch: ${{ inputs.arch }}
          native-artifact-name: ${{ inputs.native-artifact-name }}
          shard: loader
          test-filter: ${{ env.TEST_FILTER }}
          need-raw: 'true'
          need-lut: 'false'
          test-timeout-minutes: '35'
          log-artifact-name: ${{ inputs.log-artifact-name }}
          log-retention-days: ${{ inputs.log-retention-days }}

  # -------- shard 3: demosaic / develop (10 tests, the heavy shard) --------
  test-image-develop:
    name: Smoke / test_image_develop
    needs: [prep-emulator]
    runs-on: ubuntu-26.04
    # 75 min: five 36..50 MP software demosaics (minutes per sample) — the budget
    # the old single job carried, now paid by this shard alone.
    timeout-minutes: 75
    env:
      # Native develop-entry boundary; one develop-through-menu journey per RAW
      # brand; the every-menu-option + exposure recompute proof.
      TEST_FILTER: >-
        io.github.fotlab.fotlab.smoke.RawlerNativeSmokeTest#developOfNonRawBytesReturnsNull+developOfPngSurvives+developDirectCallSurfacesJvmException,
        io.github.fotlab.fotlab.smoke.RawRoutingTest#sonyArwDevelopsThroughDemosaicMenu+developEachDemosaicAlgorithmProducesFullFrame
    steps:
      # Checkout must precede the local action — see the test-app-smoke shard above.
      - name: Check out
        uses: actions/checkout@v7

      - name: Run image develop shard
        uses: ./.github/actions/emulator_smoke_shard
        with:
          api-level: ${{ inputs.api-level }}
          target: ${{ inputs.target }}
          arch: ${{ inputs.arch }}
          native-artifact-name: ${{ inputs.native-artifact-name }}
          shard: develop
          test-filter: ${{ env.TEST_FILTER }}
          need-raw: 'true'
          need-lut: 'false'
          test-timeout-minutes: '60'
          log-artifact-name: ${{ inputs.log-artifact-name }}
          log-retention-days: ${{ inputs.log-retention-days }}

  # -------- shard 4 (grading / alchemy + LUT) removed: its test methods were
  #          deleted from the suite during the studio rework, so there is no
  #          coverage left to run here. Re-add a job if those tests return.

