# Reusable workflow: smoke-tests the debug build on an Android emulator.
#
# Called by build.yaml as the sibling of release_github.yaml, and only for a
# NON-release run: a release is verified by publishing the APK, not by booting an
# emulator. `connectedDebugAndroidTest` installs the debug APK together with its
# instrumented test APK and runs the cases in the AGP-default instrumented source
# set `app/src/androidTest/kotlin` (Google's recommended app layout), so the tests
# execute against the packaged application on a real Android runtime.
#
# Two prerequisites the job cannot skip, both learned the hard way:
#   * KVM must be made accessible BEFORE the emulator starts. /dev/kvm exists on the
#     image but belongs to group `kvm`, which the runner user is not in; without the
#     udev rule below the emulator silently falls back to -accel off and its adb
#     daemon never comes up.
#   * the AVD and the emulator's SDK packages (system image, emulator, build-tools)
#     must be cached TOGETHER — an AVD with no system image cannot boot.
#
# Emulator reuse (why the cache steps are ordered the way they are):
#   1. restore the emulator cache (AVD + snapshot + the SDK packages it boots);
#   2. on a miss, install those packages, create the AVD and generate its snapshot;
#   3. SAVE the emulator cache — at this point the emulator exists but our APK has
#      never been installed, so the cached snapshot carries no app state and stays
#      valid for every later build;
#   4. only now run the tests, which install the APK.
# Steps 1/3 use `cache/restore` + `cache/save` rather than plain `actions/cache`
# precisely because the save has to happen HERE — mid-job, before the APK is
# installed — instead of in a post-job step.
#
# See rules/ACTION.md (Test Strategy, CI cache layers) and FOTLAB-CRASH-000001.

name: Emulator Smoke Test

on:
  workflow_call:
    inputs:
      native-artifact-name:
        description: >
          Name of the native artifact (librawler_fotlab.so + Kotlin bindings) to download and
          place before Gradle. Empty means skip native placement (no rawler_fotlab lib).
        required: false
        type: string
        default: ''
      api-level:
        description: API level of the AVD's system image.
        required: false
        type: string
        default: '36'
      target:
        description: System-image flavour (google_apis, default, aosp_atd, ...).
        required: false
        type: string
        default: google_apis
      arch:
        description: >
          AVD architecture. Must be an ABI present in librawler_fotlab.so — x86_64 for the
          hosted ubuntu runners.
        required: false
        type: string
        default: x86_64
      log-artifact-name:
        description: Name of the uploaded failure log artifact. Empty means no log artifact.
        required: false
        type: string
        default: ''
      log-retention-days:
        description: Retention of the failure log artifact, in days.
        required: false
        type: number
        default: 7

permissions:
  contents: read

jobs:
  smoke:
    name: Emulator Smoke Test
    runs-on: ubuntu-26.04
    # A wedged emulator must fail the job, not hold the runner until the default
    # 6-hour ceiling.
    timeout-minutes: 45
    env:
      ANDROID_API: '36'
      ANDROID_BUILD_TOOLS: '36.0.0'
      # Emulator flags. Deliberately job env values, not inputs — an input would let a
      # caller break the snapshot invariants below:
      #  * Cache-warming run passes nothing snapshot-related, so the emulator WRITES
      #    the quick-boot snapshot on exit and the cache captures it.
      #  * The test run adds -no-snapshot-save: it LOADS that snapshot but never
      #    overwrites it, so our APK can never contaminate the cached emulator. The
      #    two option sets differ by exactly that flag and nothing else.
      EMULATOR_OPTIONS: '-no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none'
      EMULATOR_OPTIONS_TEST: '-no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save'
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install JDK
        uses: ./.github/actions/install_jdk
        with:
          java-version: '17'
          distribution: temurin

      - name: Locate Android SDK
        uses: ./.github/actions/locate_sdk

      - name: Install Android SDK
        uses: ./.github/actions/install_sdk
        with:
          android-home: ${{ env.ANDROID_HOME }}
          api-level: ${{ env.ANDROID_API }}
          build-tools: ${{ env.ANDROID_BUILD_TOOLS }}

      # Mandatory on Linux runners, and the reason the first smoke run failed:
      # /dev/kvm exists on the image but is owned by group `kvm`, which the runner
      # user is not in, so the emulator started with `-accel off` and its adb daemon
      # never came up ("ProbeKVM: This user doesn't have permissions to use KVM").
      # The udev rule widens the mode to 0666 — group membership can't be granted
      # mid-job, because a new supplementary group only applies to a fresh login
      # session, which agent processes are not. This is the recipe published by the
      # emulator-runner action itself.
      - name: Enable KVM
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
        shell: bash

      # The Gradle build cache is written by the apk job and restored here, so
      # connectedDebugAndroidTest re-runs only what the apk job could not hand over
      # (the androidTest APK) instead of recompiling the application.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.14.5'
          validate-wrappers: false

      # -------- native (rawler_fotlab) --------
      # Same placement as build_gradle.yaml: the .so + generated Kotlin bindings go into
      # the Gradle build directory, never under src/ (FOTLAB-STRUCT-000002 R1).
      - name: Download native artifact (rawler_fotlab)
        if: inputs.native-artifact-name != ''
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.native-artifact-name }}
          path: native-artifacts

      - name: Place native libs + Kotlin bindings
        if: inputs.native-artifact-name != ''
        run: |
          set -euo pipefail
          mkdir -p app/build/generated/jniLibs
          cp -r native-artifacts/jniLibs/* app/build/generated/jniLibs/
          mkdir -p app/build/generated/uniffi/main/kotlin
          cp -r native-artifacts/kotlin/. app/build/generated/uniffi/main/kotlin/
        shell: bash

      # -------- emulator (AVD + emulator SDK cache) --------
      # ONE entry on purpose. An AVD is useless without the system image it boots, so
      # the AVD and the SDK packages the emulator-runner installs are cached under a
      # single key; splitting them would allow the AVD to hit while the system image
      # missed, leaving the emulator with nothing to boot.
      # Cached paths and why each is there:
      #  * ~/.android/avd + ~/.android/adb* — the AVD, its config and its snapshot.
      #  * system-images + emulator         — what the action otherwise re-downloads
      #    from dl.google.com on EVERY run (the API-36 google_apis x86_64 image plus
      #    the emulator package, ~1.4 GB). Restoring them also short-circuits the
      #    action's `sdkmanager --install`, because each package's own package.xml
      #    metadata travels inside the cached directory.
      #  * build-tools                      — present only because the action
      #    force-installs the LATEST build-tools (37.0.0 as of writing) alongside the
      #    pinned 36.0.0 install_sdk guarantees; without this that is another ~110 MB
      #    on every run.
      - name: Restore emulator cache
        id: emulator-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
            ${{ env.ANDROID_HOME }}/system-images
            ${{ env.ANDROID_HOME }}/emulator
            ${{ env.ANDROID_HOME }}/build-tools
          key: ${{ runner.os }}-emulator-${{ inputs.api-level }}-${{ inputs.target }}-${{ inputs.arch }}

      # Cold path only: install the SDK packages, build the AVD and let the emulator
      # write its snapshot, which is what the following save captures.
      - name: Create AVD and generate a snapshot for caching
        if: steps.emulator-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.api-level }}
          target: ${{ inputs.target }}
          arch: ${{ inputs.arch }}
          # Reuse the AVD this action already created rather than recreating it.
          force-avd-creation: false
          emulator-options: ${{ env.EMULATOR_OPTIONS }}
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      # Cold path only. Saved BEFORE any APK is installed, so the cached emulator is a
      # clean one and is reused by every subsequent run.
      - name: Save emulator cache
        if: steps.emulator-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
            ${{ env.ANDROID_HOME }}/system-images
            ${{ env.ANDROID_HOME }}/emulator
            ${{ env.ANDROID_HOME }}/build-tools
          key: ${{ runner.os }}-emulator-${{ inputs.api-level }}-${{ inputs.target }}-${{ inputs.arch }}

      # -------- instrumented smoke tests --------
      # Installs the debug APK + its test APK on the emulator and runs
      # app/src/androidTest/kotlin. This is the first point at which our app touches
      # the emulator — see the ordering note at the top of this file.
      - name: Run emulator smoke tests
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.api-level }}
          target: ${{ inputs.target }}
          arch: ${{ inputs.arch }}
          force-avd-creation: false
          emulator-options: ${{ env.EMULATOR_OPTIONS_TEST }}
          disable-animations: true
          # Capture the native crash context: clear logcat, run the instrumented tests, then
          # dump the full logcat (incl. the `crash` buffer) and list any tombstones. A rawler
          # FFI call that aborts the process leaves a SIGSEGV/SIGABRT backtrace here — without
          # this we are blind to WHY the cross-language call dies (`DNGLAB-RAWLER-000002`).
          script: |
            set -o pipefail
            adb logcat -c || true
            gradle --no-daemon --stacktrace connectedDebugAndroidTest 2>&1 | tee smoke-log.txt
            STATUS=${PIPESTATUS[0]}
            adb logcat -d -b all > logcat.txt 2>&1 || true
            adb shell ls -l /data/tombstones > tombstones.txt 2>&1 || true
            exit $STATUS

      # Reports, the Gradle log, and the captured native diagnostics are kept on failure
      # (matching build_gradle.yaml). logcat.txt / tombstones.txt are what turn a silent
      # "process died" into a readable SIGSEGV/SIGABRT backtrace for the rawler FFI path.
      - name: Upload smoke logs
        if: failure() && inputs.log-artifact-name != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.log-artifact-name }}
          path: |
            smoke-log.txt
            logcat.txt
            tombstones.txt
            app/build/reports/androidTests/connected
            app/build/outputs/androidTest-results/connected
          retention-days: ${{ inputs.log-retention-days }}
          if-no-files-found: warn
