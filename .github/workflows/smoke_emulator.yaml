# Reusable workflow: smoke-tests the debug build on a prebuilt Android emulator.
#
# Called by build.yaml as the sibling of release_github.yaml, and only for a
# NON-release run: a release is verified by publishing the APK, not by booting an
# emulator.
#
# The instrumented suite is split into FOUR independent, parallel shard jobs so a
# slow or wedged slice never blocks the other three, and the wall-clock budget is
# the slowest shard instead of the whole suite:
#
#   test_app_smoke       MainActivity reaches RESUMED; zoom/pan gesture tests.
#                        No RAW corpus, no LUT — the fastest signal that the app boots.
#   test_image_loader    PNG end-to-end import/viewer/studio route; native
#                        identify/decode boundary calls; the five RAW brands
#                        opening in Studio through rawler (load + as-shot render).
#   test_image_develop   native develop entry boundary; five RAW brands through
#                        the demosaic menu + the full algorithm/exposure redevelop
#                        proof. The HEAVY shard (36..50 MP software demosaics).
#   test_image_alchemy   log/grade enumeration; boost+log and grade-bar journeys;
#                        the Panasonic V-Log + downloaded .cube LUT journey and the
#                        SAF LUT-picker contract. Needs the LUT fixture.
#
# Each shard passes an AndroidJUnitRunner `-e class` list to
# connectedDebugAndroidTest via -PsmokeTestFilter (mapped in app/build.gradle.kts).
# The membership of every @Test lives in one place: the TEST_FILTER env below.
#
# ONLY three selector forms exist: `Class`, `Class#method`, and a comma-separated
# list of those. A token the runner cannot parse is NOT a syntax error — it
# selects nothing, nothing is reported, and the shard still ends in
# BUILD SUCCESSFUL with "Starting 0 tests". `Class#m1+m2` is exactly such a token
# (the runner reads it as class `Class`, method `m1+m2`), so 29 of the 40
# instrumented tests were silently unexecuted for as long as they had been
# written that way. Hence two rules when editing a TEST_FILTER below:
#   * one selector per line, comma-separated, never `+` (a line inside this folded
#     block is a plain scalar, and the `#` in `Class#method` is part of it — do NOT
#     add `#` comments inside it);
#   * keep the shard's `expected-tests` in step with the list. run_smoke_shard.sh
#     compares it against the count AGP reports and fails the job on a mismatch,
#     so a filter that selects the wrong number can no longer pass quietly.
#
# A fifth job, prep-emulator, warms the RAW corpus cache exactly once; all four
# shards `needs: prep-emulator` and only ever RESTORE it. This keeps cache writes
# off the parallel jobs, so N shards can never race saving the same cache key.
# The emulator is NOT cached: each shard boots the prebuilt docker-android image
# (~2.5 GB pull, on runner disk, NOT in the 10 GiB Actions-cache budget).
#
# -------- shard switchboard --------
#
# `enabled-shards` below is the list of shard ids that are actually orchestrated;
# an id that is not in it is skipped before the emulator container starts, so a
# switched-off shard costs neither runner minutes nor a red job. It exists because two of the
# four shards cannot pass on a hosted runner, for reasons that are the runner's
# and not the product's:
#
#   test_image_develop  — five 36..50 MP *software* demosaics plus the
#                         every-menu-option redevelop proof. Red on every run.
#   test_image_alchemy  — the same corpus through a rawalchemy grade: the app is
#                         killed by OutOfMemoryError ("Failed to allocate a
#                         186927576 byte allocation … 35MB until OOM") and by
#                         480 s wait timeouts.
#
# Both are kept wired — filters, expected-tests and all — and are re-enabled by
# adding their id back to the list; nothing else has to change. Treat them as
# "known-unrunnable here", NOT as "known-good": the tests they cover are real
# coverage we currently cannot buy on GitHub's emulator, and the honest fix is a
# faster/roomier runner or a-reduced-size fixture, not the switch.
#
# The emulator API level is fixed by the docker-android image (api-33). We
# accepted the 36 -> 33 test-coverage downgrade when adopting this image
# (see rules/REVIEW/detail/ACTION-PREPIN-000002.md); the APK is still compiled
# against compileSdk 36 and only RUN on api-33. One prerequisite the jobs cannot
# skip, learned the hard way with the old self-built AVD and still true here:
#   * KVM must be available to the container (docker run --device /dev/kvm) or the
#     emulator falls back to TCG and will not boot in time. The emulator runs as
#     root inside the container, so the host-side udev rule the runner-local AVD
#     needed is gone.
#
# See rules/ACTION.md (Test Strategy, CI cache layers) and FOTLAB-CRASH-000001.

name: Emulator Smoke Test

on:
  workflow_call:
    inputs:
      native-artifact-name:
        description: >
          Name of the native artifact (librawler_fotlab.so + Kotlin bindings) to download and
          place before Gradle. Empty means skip native placement (no rawler_fotlab lib).
        required: false
        type: string
        default: ''
      emulator-image:
        description: >
          Prebuilt Android-emulator Docker image to boot (e.g. halimqarroum/docker-android:api-33).
          The image fixes the API level / ABI, so there is no separate api-level input. Default is
          the public image; mirror to ghcr.io/fot-lab/docker-android:api-33 to avoid Docker Hub
          anonymous rate limits.
        required: false
        type: string
        default: halimqarroum/docker-android:api-33
      log-artifact-name:
        description: Base name of the uploaded per-shard failure log artifacts (a -<shard> suffix is appended). Empty means no log artifact.
        required: false
        type: string
        default: ''
      log-retention-days:
        description: Retention of the failure log artifacts, in days.
        required: false
        type: number
        default: 7
      enabled-shards:
        description: >
          JSON array of shard ids to orchestrate: "app", "loader", "develop",
          "alchemy". An id left out is skipped before the emulator container starts. "develop" and
          "alchemy" are out of the default list because the hosted emulator cannot
          finish them (OutOfMemoryError and 480 s wait timeouts on 36..50 MP
          software demosaics) — see the shard switchboard note at the top of this
          file before putting either back.
        required: false
        type: string
        default: '["app","loader"]'

permissions:
  contents: read

jobs:
  # Warms the RAW corpus cache exactly once. The emulator is no longer cached:
  # each shard boots the prebuilt docker-android image and runs its slice against
  # it, so there is nothing to warm for the emulator here. All four shards start
  # only after this finishes, so their RAW-corpus restores are warm and their
  # saves are unnecessary (a shard that hits an evicted cache simply re-downloads).
  prep-emulator:
    name: Smoke prep (RAW corpus)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7

      # -------- RAW corpus (fot-lab/rawdb) — immutable, cached once --------
      - name: Restore RAW sample cache
        id: raw-samples-cache
        uses: actions/cache/restore@v6
        with:
          path: raw-samples
          key: rawdb-samples-v1

      - name: Download RAW samples
        if: steps.raw-samples-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p raw-samples
          base="https://github.com/fot-lab/rawdb/raw/refs/heads/samples"
          curl -fL --retry 3 --retry-delay 5 \
            -o "raw-samples/Canon EOS 5DS_ISO_1000_RAW.CR2" \
            "$base/Canon/EOS%205DS/Canon%20EOS%205DS_ISO_1000_RAW.CR2"
          curl -fL --retry 3 --retry-delay 5 \
            -o "raw-samples/ILCE-7R_ISO_50_14bits_Sony ARW Compressed.ARW" \
            "$base/Sony/ILCE-7R/ILCE-7R_ISO_50_14bits_Sony%20ARW%20Compressed.ARW"
          curl -fL --retry 3 --retry-delay 5 \
            -o "raw-samples/ILCE-7RM2_ISO_100_14bits_Compressed RAW.ARW" \
            "$base/Sony/ILCE-7RM2/ILCE-7RM2_ISO_100_14bits_Compressed%20RAW.ARW"
          curl -fL --retry 3 --retry-delay 5 \
            -o "raw-samples/NIKON D850_Large_ISO_64_14bits_Lossless.NEF" \
            "$base/Nikon/D850/NIKON%20D850_Large_ISO_64_14bits_Lossless.NEF"
          curl -fL --retry 3 --retry-delay 5 \
            -o "raw-samples/DC-S1R_ISO_100_6fmt_8368x5584.RW2" \
            "$base/Panasonic/DC-S1R/DC-S1R_ISO_100_6fmt_8368x5584.RW2"
          ls -l raw-samples
        shell: bash

      - name: Save RAW sample cache
        if: steps.raw-samples-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: raw-samples
          key: rawdb-samples-v1

  # -------- shard 1: app shell + gestures (7 tests, no corpus) --------
  test-app-smoke:
    name: Smoke / test_app_smoke
    # Switchboard: skipped entirely (no emulator container start, no runner minutes) unless this
    # shard's id is in `enabled-shards`.
    if: ${{ contains(fromJSON(inputs.enabled-shards), 'app') }}
    needs: [prep-emulator]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      # Whole classes: app boot + the zoomable/gesture suite.
      TEST_FILTER: >-
        io.github.fotlab.fotlab.smoke.MainActivitySmokeTest,
        io.github.fotlab.fotlab.smoke.ZoomableGestureTest
    steps:
      # Must check out BEFORE invoking the local composite action: the runner reads
      # .github/actions/emulator_smoke_shard/action.yml from disk at expansion time,
      # so a checkout that only happens INSIDE the action is one step too late.
      - name: Check out
        uses: actions/checkout@v7

      - name: Run app smoke shard
        uses: ./.github/actions/emulator_smoke_shard
        with:
          emulator-image: ${{ inputs.emulator-image }}
          native-artifact-name: ${{ inputs.native-artifact-name }}
          shard: app
          test-filter: ${{ env.TEST_FILTER }}
          expected-tests: '7'
          need-raw: 'false'
          need-lut: 'false'
          test-timeout-minutes: '20'
          log-artifact-name: ${{ inputs.log-artifact-name }}
          log-retention-days: ${{ inputs.log-retention-days }}

  # -------- shard 2: identify / decode / load + open routes (20 tests) --------
  test-image-loader:
    name: Smoke / test_image_loader
    # Switchboard — see test-app-smoke.
    if: ${{ contains(fromJSON(inputs.enabled-shards), 'loader') }}
    needs: [prep-emulator]
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      # PNG end-to-end; native sniff/decode boundary (incl. the .so load sanity and
      # exception surfacing); the open route for the PNG control and all five RAW
      # brands (load + as-shot render), plus the grade-bar hidden-on-PNG assertion.
      TEST_FILTER: >-
        io.github.fotlab.fotlab.smoke.PngEndToEndFlowTest,
        io.github.fotlab.fotlab.smoke.RawlerNativeSmokeTest#nativeLibraryIsLoadableOnThisAbi,
        io.github.fotlab.fotlab.smoke.RawlerNativeSmokeTest#identifyRejectsNonRawBytes,
        io.github.fotlab.fotlab.smoke.RawlerNativeSmokeTest#identifyOnPngSurvives,
        io.github.fotlab.fotlab.smoke.RawlerNativeSmokeTest#decodeOfNonRawBytesReturnsNull,
        io.github.fotlab.fotlab.smoke.RawlerNativeSmokeTest#decodeOfPngSurvives,
        io.github.fotlab.fotlab.smoke.RawlerNativeSmokeTest#identifyCallSurfacesJvmExceptions,
        io.github.fotlab.fotlab.smoke.RawRoutingTest#pngOpensInStudioThroughCoil,
        io.github.fotlab.fotlab.smoke.RawRoutingTest#canonCr2OpensInStudioThroughRawler,
        io.github.fotlab.fotlab.smoke.RawRoutingTest#sonyIlce7rArwOpensInStudioThroughRawler,
        io.github.fotlab.fotlab.smoke.RawRoutingTest#sonyIlce7rm2ArwOpensInStudioThroughRawler,
        io.github.fotlab.fotlab.smoke.RawRoutingTest#nikonD850NefOpensInStudioThroughRawler,
        io.github.fotlab.fotlab.smoke.RawRoutingTest#panasonicDcS1rRw2OpensInStudioThroughRawler,
        io.github.fotlab.fotlab.smoke.RawRoutingTest#gradeBarIsHiddenOnPngRoute
    steps:
      # Checkout must precede the local action — see the test-app-smoke shard above.
      - name: Check out
        uses: actions/checkout@v7

      - name: Run image loader shard
        uses: ./.github/actions/emulator_smoke_shard
        with:
          emulator-image: ${{ inputs.emulator-image }}
          native-artifact-name: ${{ inputs.native-artifact-name }}
          shard: loader
          test-filter: ${{ env.TEST_FILTER }}
          expected-tests: '20'
          need-raw: 'true'
          need-lut: 'false'
          # Two-phase demosaiced-cache protocol: phase 1 = cache ON (app default). An OOM
          # process crash is judged by the RAW-journey floor (>=2 of these five must have
          # passed); below the floor the script re-runs once with the cache OFF.
          raw-journey-tests: >-
            io.github.fotlab.fotlab.smoke.RawRoutingTest#canonCr2OpensInStudioThroughRawler,
            io.github.fotlab.fotlab.smoke.RawRoutingTest#sonyIlce7rArwOpensInStudioThroughRawler,
            io.github.fotlab.fotlab.smoke.RawRoutingTest#sonyIlce7rm2ArwOpensInStudioThroughRawler,
            io.github.fotlab.fotlab.smoke.RawRoutingTest#nikonD850NefOpensInStudioThroughRawler,
            io.github.fotlab.fotlab.smoke.RawRoutingTest#panasonicDcS1rRw2OpensInStudioThroughRawler
          test-timeout-minutes: '35'
          log-artifact-name: ${{ inputs.log-artifact-name }}
          log-retention-days: ${{ inputs.log-retention-days }}

  # -------- shard 3: demosaic / develop (12 tests, the heavy shard) --------
  test-image-develop:
    name: Smoke / test_image_develop
    # Switchboard — OFF by default: five 36..50 MP software demosaics plus the
    # every-menu-option redevelop proof, which the hosted emulator cannot finish.
    if: ${{ contains(fromJSON(inputs.enabled-shards), 'develop') }}
    needs: [prep-emulator]
    runs-on: ubuntu-26.04
    # 75 min: five 36..50 MP software demosaics (minutes per sample) — the budget
    # the old single job carried, now paid by this shard alone.
    timeout-minutes: 75
    env:
      # Native develop-entry boundary; one develop-through-menu journey per RAW
      # brand; the every-menu-option + exposure recompute proof; superpixel as a
      # demosaic entry (both axes halved on BOTH the develop and the rawalchemy
      # grade fork, and the byte-identical round trip back to full resolution).
      TEST_FILTER: >-
        io.github.fotlab.fotlab.smoke.RawlerNativeSmokeTest#developOfNonRawBytesReturnsNull,
        io.github.fotlab.fotlab.smoke.RawlerNativeSmokeTest#developOfPngSurvives,
        io.github.fotlab.fotlab.smoke.RawlerNativeSmokeTest#developDirectCallSurfacesJvmException,
        io.github.fotlab.fotlab.smoke.RawRoutingTest#canonCr2DevelopsThroughDemosaicMenu,
        io.github.fotlab.fotlab.smoke.RawRoutingTest#sonyIlce7rArwDevelopsThroughDemosaicMenu,
        io.github.fotlab.fotlab.smoke.RawRoutingTest#sonyIlce7rm2ArwDevelopsThroughDemosaicMenu,
        io.github.fotlab.fotlab.smoke.RawRoutingTest#nikonD850NefDevelopsThroughDemosaicMenu,
        io.github.fotlab.fotlab.smoke.RawRoutingTest#panasonicDcS1rRw2DevelopsThroughDemosaicMenu,
        io.github.fotlab.fotlab.smoke.RawRoutingTest#everyDemosaicMenuOptionRedevelopsOnBayerAndExposureRecomputes,
        io.github.fotlab.fotlab.smoke.RawRoutingTest#manualKelvinWhiteBalanceRedevelopsWithoutBlack,
        io.github.fotlab.fotlab.smoke.RawRoutingTest#fullResolutionDevelopKeepsBothAxesAboveThePreviewFloor,
        io.github.fotlab.fotlab.smoke.RawRoutingTest#superpixelHalvesBothAxesOnDevelopAndGrade
    steps:
      # Checkout must precede the local action — see the test-app-smoke shard above.
      - name: Check out
        uses: actions/checkout@v7

      - name: Run image develop shard
        uses: ./.github/actions/emulator_smoke_shard
        with:
          emulator-image: ${{ inputs.emulator-image }}
          native-artifact-name: ${{ inputs.native-artifact-name }}
          shard: develop
          test-filter: ${{ env.TEST_FILTER }}
          expected-tests: '12'
          need-raw: 'true'
          need-lut: 'false'
          test-timeout-minutes: '60'
          log-artifact-name: ${{ inputs.log-artifact-name }}
          log-retention-days: ${{ inputs.log-retention-days }}

  # -------- shard 4: grading / alchemy + LUT (5 tests) --------
  test-image-alchemy:
    name: Smoke / test_image_alchemy
    # Switchboard — OFF by default: the graded fork dies of OutOfMemoryError
    # ("Failed to allocate a 186927576 byte allocation … 35MB until OOM") and of
    # 480 s wait timeouts on this runner.
    if: ${{ contains(fromJSON(inputs.enabled-shards), 'alchemy') }}
    needs: [prep-emulator]
    runs-on: ubuntu-26.04
    timeout-minutes: 75
    env:
      # Native log-space enumeration; engine boost/log redevelop; grade-bar UI;
      # Panasonic V-Log + downloaded .cube LUT; the SAF LUT-picker contract.
      TEST_FILTER: >-
        io.github.fotlab.fotlab.smoke.RawlerNativeSmokeTest#gradeLogSpacesAreEnumeratedNatively,
        io.github.fotlab.fotlab.smoke.RawRoutingTest#boostAndLogGradesReRenderThroughEngineAndNoneRestoresDevelop,
        io.github.fotlab.fotlab.smoke.RawRoutingTest#gradeBarChipsDriveGradingThroughRealStudioUi,
        io.github.fotlab.fotlab.smoke.RawRoutingTest#panasonicVLogAndDownloadedLutCubeBothTakeEffect,
        io.github.fotlab.fotlab.smoke.RawRoutingTest#lutChipOpensSystemPickerAndAppliesDownloadedCube
    steps:
      # Checkout must precede the local action — see the test-app-smoke shard above.
      - name: Check out
        uses: actions/checkout@v7

      - name: Run image alchemy shard
        uses: ./.github/actions/emulator_smoke_shard
        with:
          emulator-image: ${{ inputs.emulator-image }}
          native-artifact-name: ${{ inputs.native-artifact-name }}
          shard: alchemy
          test-filter: ${{ env.TEST_FILTER }}
          expected-tests: '5'
          need-raw: 'true'
          need-lut: 'true'
          test-timeout-minutes: '60'
          log-artifact-name: ${{ inputs.log-artifact-name }}
          log-retention-days: ${{ inputs.log-retention-days }}
