# Builds the docker-android emulator image from the external/docker-android submodule
# and publishes it to GitHub Container Registry (GHCR) under this repository's
# namespace. This workflow is the ONLY producer of the image.
#
# Gating: it runs ONLY when the docker-android submodule (or this file) changes, so
# ordinary app/CI changes never rebuild the image, and the regular CI (build.yaml) is
# gated to ignore docker-android. The two flows are independent: CI only consumes the
# image, this workflow only builds it.
#
# Published as ghcr.io/<owner>/docker-android:<tag>. The `api-33` tag mirrors the
# upstream `halimqarroum/docker-android:api-33` the CI smoke tests consume; `main` and
# the commit SHA are also pushed for traceability. The consumer (smoke_emulator.yaml)
# authenticates to GHCR with a GITHUB_TOKEN passed into the composite action, so the
# package MAY be private OR public — visibility is a separate UI setting, not a build
# concern. (ghcr requires an authenticated pull even for public packages.)

name: Docker Android Image

on:
  push:
    branches: [main]
    paths:
      - 'external/docker-android'
      - 'external/docker-android/**'
      - '.github/workflows/docker-android.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'external/docker-android'
      - 'external/docker-android/**'
      - '.github/workflows/docker-android.yaml'

permissions:
  contents: read
  packages: write
  actions: read

jobs:
  build-and-push:
    name: Build & push docker-android (GHCR)
    runs-on: ubuntu-26.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # The docker-android submodule is checked out on its own (not via
      # actions/checkout's `submodules`, which only accepts true/recursive and
      # would pull all 12 submodules). The relative .gitmodules URL resolves to
      # https://github.com/fot-lab/docker-android.git; inject the token so the
      # clone is authenticated.
      - name: Check out docker-android submodule
        run: |
          git config --global url."https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"
          git submodule update --init --depth 1 external/docker-android

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/docker-android
          tags: |
            type=raw,value=api-33,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: external/docker-android
          file: external/docker-android/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # NOTE: the image is pulled by the smoke workflows, which authenticate to GHCR
      # with their own GITHUB_TOKEN (packages: read) passed into the composite action
      # via the `ghcr-token` input — so the pull works whether the package is public or
      # private. We authenticate regardless of visibility because ghcr requires an
      # authenticated pull (and it avoids anonymous rate limits). To flip the package to
      # PUBLIC, change its visibility in the GitHub UI (Packages → docker-android →
      # Settings → Change visibility): the org package-visibility REST API is blocked for
      # both the CI bot token (HTTP 404) and the local token (no read:packages scope).
