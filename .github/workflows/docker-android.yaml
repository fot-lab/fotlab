# Builds the docker-android emulator image from the external/docker-android submodule
# and publishes it to GitHub Container Registry (GHCR) under this repository's
# namespace. This workflow is the ONLY producer of the image.
#
# Gating: it runs ONLY when the docker-android submodule (or this file) changes, so
# ordinary app/CI changes never rebuild the image, and the regular CI (build.yaml) is
# gated to ignore docker-android. The two flows are independent: CI only consumes the
# image, this workflow only builds it.
#
# Published as ghcr.io/<owner>/docker-android:<tag>. The `api-33` tag mirrors the
# upstream `halimqarroum/docker-android:api-33` the CI smoke tests consume; `main` and
# the commit SHA are also pushed for traceability. The package is made public so the CI
# workflows can pull it anonymously (same as the current Docker Hub pull).

name: Docker Android Image

on:
  push:
    branches: [main]
    paths:
      - 'external/docker-android'
      - 'external/docker-android/**'
      - '.github/workflows/docker-android.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'external/docker-android'
      - 'external/docker-android/**'
      - '.github/workflows/docker-android.yaml'

permissions:
  contents: read
  packages: write
  actions: read

jobs:
  build-and-push:
    name: Build & push docker-android (GHCR)
    runs-on: ubuntu-26.04
    steps:
      - name: Check out (with docker-android submodule)
        uses: actions/checkout@v7
        with:
          submodules: external/docker-android
          fetch-depth: 1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/docker-android
          tags: |
            type=raw,value=api-33,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: external/docker-android
          file: external/docker-android/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Make the freshly-pushed image pullable by the CI workflows without auth
      # (mirrors the anonymous Docker Hub pull the smoke tests currently rely on).
      - name: Set GHCR package visibility to public
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PATCH \
            "/orgs/${{ github.repository_owner }}/packages/container/docker-android/visibility" \
            -f visibility=public \
            || echo "::warning::Could not set package visibility; set it to public manually in GHCR."
