# Orchestrator: owns triggers, path filters, job order and release decisions.
# It contains no build steps of its own — every stage is a reusable workflow:
#   * build_gradle.yaml    — Android toolchain (via the devenv-android composite
#                            action) + Gradle build, uploads APK and logs
#   * release_github.yaml  — publish a GitHub Release (pre-release on -rc)
# The shared toolchain steps live in .github/actions/devenv-android (a composite
# action, reused in-job by build_gradle.yaml). See rules/ACTION.md and detail
# GITHUB-ACTION-000002.

name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'rules/**'
      - 'LICENSE*'
      - '.gitignore'
      - '.readthedocs.yaml'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'rules/**'
      - 'LICENSE*'
      - '.gitignore'
      - '.readthedocs.yaml'
  workflow_dispatch:
    inputs:
      release:
        description: Produce a release APK and publish a GitHub Release.
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  # Flow logic: decide whether this run is a release. Every downstream stage keys off it.
  preflight:
    name: Preflight
    runs-on: ubuntu-26.04
    outputs:
      release: ${{ steps.flags.outputs.release }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute release flag
        id: flags
        run: |
          release=false
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            release=true
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.release }}" = "true" ]; then
            release=true
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
        shell: bash

  # Native stage. Builds librawler_fotlab.so (+ UniFFI Kotlin bindings) from the first-party
  # crate app/src/rust/binding/dnglab/rawler_fotlab via cargo/NDK and uploads them as the
  # `rawler_fotlab` artifact consumed by the APK job.
  rust:
    name: Native (rawler_fotlab)
    needs: [preflight]
    if: ${{ always() && needs.preflight.result == 'success' }}
    uses: ./.github/workflows/build_rust.yaml
    with:
      submodules: true

  # Build stage. Reused for both the push/PR fast path and the release path;
  # release-build + the release APK artifact name are selected by the release flag.
  apk:
    name: APK
    needs: [preflight, rust]
    if: ${{ always() && needs.preflight.result == 'success' }}
    uses: ./.github/workflows/build_gradle.yaml
    with:
      gradle-tasks: ${{ needs.preflight.outputs.release == 'true' && 'assembleRelease' || 'testDebugUnitTest assembleDebug' }}
      release-build: ${{ needs.preflight.outputs.release == 'true' }}
      apk-path: ${{ needs.preflight.outputs.release == 'true' && 'app/build/outputs/apk/release/*.apk' || 'app/build/outputs/apk/debug/*.apk' }}
      apk-artifact-name: ${{ needs.preflight.outputs.release == 'true' && 'fotlab-release-apk' || 'debug-apks' }}
      apk-retention-days: ${{ needs.preflight.outputs.release == 'true' && 30 || 1 }}
      log-artifact-name: build-gradle.log
      log-retention-days: 7
      native-artifact-name: ${{ needs.rust.outputs.artifact-name }}
    secrets:
      FOTLAB_KEYSTORE_SECRET: ${{ secrets.FOTLAB_KEYSTORE_SECRET }}

  # Release stage. Only on a v* tag or a release dispatch, and only when the APK
  # build succeeded. The -rc vs formal release decision is made in release_github.
  github-release:
    name: GitHub Release
    needs: [preflight, apk]
    if: ${{ always() && needs.preflight.outputs.release == 'true' && needs.apk.result == 'success' }}
    permissions:
      contents: write
    uses: ./.github/workflows/release_github.yaml
    with:
      apk-artifact-name: fotlab-release-apk
      version-name: ${{ needs.apk.outputs.version-name }}

  # Smoke stage — the release stage's sibling, and its exact complement: a normal
  # run (push/PR, no v* tag, release flag false) boots cached AVDs and runs the
  # instrumented smoke tests split into four parallel shards
  # (test_app_smoke / test_image_loader / test_image_develop /
  # test_image_alchemy) behind one cache-warming prep job, while a release run
  # skips it entirely and publishes instead. Both key off the same release flag
  # computed in preflight.
  emulator-smoke:
    name: Emulator Smoke Test
    needs: [preflight, rust, apk]
    if: ${{ always() && needs.preflight.outputs.release != 'true' && needs.apk.result == 'success' }}
    uses: ./.github/workflows/smoke_emulator.yaml
    with:
      native-artifact-name: ${{ needs.rust.outputs.artifact-name }}
      log-artifact-name: build-smoke.log
