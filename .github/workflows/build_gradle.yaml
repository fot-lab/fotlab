# Reusable workflow: builds the app with Gradle and uploads the APK + logs.
#
# The Android toolchain is provided by three reusable composite actions under
# .github/actions/ — install_jdk, install_sdk and (for native builds) install_ndk
# — so each toolchain component is defined and cached in one place and reused
# in-job. This workflow has no triggers of its own; build.yaml calls it (and
# passes release/apk parameters). See rules/ACTION.md and detail
# GITHUB-ACTION-000002.

name: Gradle Build

on:
  workflow_call:
    inputs:
      gradle-tasks:
        description: >
          Gradle tasks to run, e.g. "testDebugUnitTest assembleDebug".
          Empty means: set the toolchain up and run nothing.
        required: false
        type: string
        default: ''
      submodules:
        description: Check out git submodules under external/ recursively.
        required: false
        type: boolean
        default: false
      release-build:
        description: >
          Rename the produced APK to FotLab-<VERSION_NAME>-arm64-v8a-release.apk
          and upload that instead of the raw output directory.
        required: false
        type: boolean
        default: false
      validate-version:
        description: Fail fast when VERSION_NAME does not match the required format.
        required: false
        type: boolean
        default: true
      apk-path:
        description: Glob of the APKs to upload. Empty means no APK artifact.
        required: false
        type: string
        default: ''
      apk-artifact-name:
        description: Name of the uploaded APK artifact. Empty means no APK artifact.
        required: false
        type: string
        default: ''
      apk-retention-days:
        description: Retention of the APK artifact, in days.
        required: false
        type: number
        default: 1
      log-artifact-name:
        description: Name of the uploaded build log artifact. Empty means no log artifact.
        required: false
        type: string
        default: ''
      log-retention-days:
        description: Retention of the build log artifact, in days.
        required: false
        type: number
        default: 7
    secrets:
      FOTLAB_KEYSTORE_SECRET:
        description: >
          SSH private deploy key with write access to the dedicated keystore
          repo (branch `keystore`). Only used when release-build is true.
        required: false
    outputs:
      version-name:
        description: VERSION_NAME as read from the repository root.
        value: ${{ jobs.build.outputs.version-name }}

permissions:
  contents: read

jobs:
  build:
    name: Gradle Build
    runs-on: ubuntu-26.04
    outputs:
      version-name: ${{ steps.version.outputs.version-name }}
    env:
      # NOTE: ANDROID_HOME / ANDROID_SDK_ROOT are deliberately NOT set here. The
      # `env` context is not available inside a job's own `env:` block — GitHub
      # rejects it with "Unrecognized named-value: 'env'", which invalidates the
      # whole workflow file (and every reusable workflow that calls it). $HOME is
      # also a runner variable, not a workflow one. Both are exported from a step
      # via $GITHUB_ENV instead. See rules/ACTION.md.
      ANDROID_API: '36'
      ANDROID_BUILD_TOOLS: '36.0.0'
      NDK_VERSION: '28.2.13676358'
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: ${{ inputs.submodules && 'recursive' || 'false' }}

      - name: Read VERSION_NAME
        id: version
        run: |
          version="$(tr -d '[:space:]' < VERSION_NAME)"
          echo "version-name=$version" >> "$GITHUB_OUTPUT"
          echo "VERSION_NAME = $version"

      - name: Validate VERSION_NAME
        if: inputs.validate-version
        run: |
          version="${{ steps.version.outputs.version-name }}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]{2}\.[0-9]{2}(-rc)?$'; then
            echo "::error::VERSION_NAME '$version' does not match YYYY.MM.DD.HH.mm(-rc)"
            exit 1
          fi

      - name: Install JDK
        uses: ./.github/actions/install_jdk
        with:
          java-version: '17'
          distribution: temurin

      # Exports ANDROID_HOME / ANDROID_SDK_ROOT for every later step — the
      # install_sdk input below reads env.ANDROID_HOME, and Gradle needs both.
      - name: Export Android SDK path
        run: |
          echo "ANDROID_HOME=$HOME/Android/Sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/Android/Sdk" >> "$GITHUB_ENV"
        shell: bash

      - name: Install Android SDK
        uses: ./.github/actions/install_sdk
        with:
          android-home: ${{ env.ANDROID_HOME }}
          api-level: ${{ env.ANDROID_API }}
          build-tools: ${{ env.ANDROID_BUILD_TOOLS }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Install Gradle 8.14.5 directly on the runner (no checked-in wrapper
          # needed). setup-gradle caches the distribution + dependency caches by
          # default, so the ubuntu runner does not re-download each run.
          gradle-version: '8.14.5'
          # We intentionally do not commit a Gradle Wrapper, so skip its validation.
          validate-wrappers: false

      # -------- keystore (release only) --------
      # The release signing keystore lives in a dedicated `keystore` repo (branch
      # `keystore`), fetched over SSH with a deploy key. On the first release run
      # the keystore is generated and pushed back to that repo; afterwards it is
      # reused. Writes keystore.properties for the Gradle release signing config.
      - name: Get or create release keystore
        if: inputs.release-build
        timeout-minutes: 10
        run: |
          set -euo pipefail
          KEYSTORE_PASS="android"
          KEY_ALIAS="androiddebugkey"
          KEY_PASS="android"

          # Redact the signing secrets in any log output for the rest of the job,
          # so a failed Gradle build can never leak them via stdout/stderr.
          echo "::add-mask::$KEYSTORE_PASS"
          echo "::add-mask::$KEY_PASS"

          KEYSTORE_REPO="git@github.com:${{ github.repository_owner }}/keystore.git"

          mkdir -p ~/.ssh
          echo "$FOTLAB_KEYSTORE_SECRET" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan github.com >> ~/.ssh/known_hosts

          if git clone --depth 1 --branch keystore "$KEYSTORE_REPO" /tmp/keystore_ks 2>/dev/null; then
            cp /tmp/keystore_ks/release.keystore "$GITHUB_WORKSPACE/release.keystore"
            echo "Using existing keystore from keystore@keystore"
          else
            echo "keystore branch not found, generating new keystore..."
            keytool -genkey -v \
              -keystore "$GITHUB_WORKSPACE/release.keystore" \
              -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KEYSTORE_PASS" -keypass "$KEY_PASS" \
              -dname "CN=Android Debug, OU=FotLab, O=FotLab, L=Unknown, ST=Unknown, C=US"

            git clone --depth 1 "$KEYSTORE_REPO" /tmp/keystore_ks
            cd /tmp/keystore_ks
            git checkout --orphan keystore
            git rm -rf --ignore-unmatched . 2>/dev/null || true
            cp "$GITHUB_WORKSPACE/release.keystore" .
            git add release.keystore
            git -c user.name="CI" -c user.email="ci@fotlab.github.io" \
              commit -m "Store release keystore"
            git push origin keystore --force
            cd "$GITHUB_WORKSPACE"
            echo "Generated and stored keystore to keystore@keystore"
          fi

          echo "RELEASE_STORE_FILE=${GITHUB_WORKSPACE}/release.keystore" > keystore.properties
          echo "RELEASE_STORE_PASSWORD=${KEYSTORE_PASS}" >> keystore.properties
          echo "RELEASE_KEY_ALIAS=${KEY_ALIAS}" >> keystore.properties
          echo "RELEASE_KEY_PASSWORD=${KEY_PASS}" >> keystore.properties
        env:
          FOTLAB_KEYSTORE_SECRET: ${{ secrets.FOTLAB_KEYSTORE_SECRET }}

      - name: Run Gradle
        if: inputs.gradle-tasks != ''
        run: |
          set -o pipefail
          # Both copies are uploaded ONLY on failure (see the upload steps below);
          # a passing run leaves no build log behind.
          gradle --no-daemon --stacktrace ${{ inputs.gradle-tasks }} 2>&1 | tee build-log.txt build_log_gradle.log
        shell: bash

      - name: No Gradle task requested
        if: inputs.gradle-tasks == ''
        run: |
          echo "No gradle-tasks requested — toolchain set up, nothing to build." | tee build-log.txt
        shell: bash

      - name: Rename release APK
        if: inputs.release-build
        run: |
          version="${{ steps.version.outputs.version-name }}"
          mkdir -p release-apk
          cp app/build/outputs/apk/release/*.apk "release-apk/FotLab-$version-arm64-v8a-release.apk"
        shell: bash

      - name: Upload APK artifact
        if: inputs.apk-artifact-name != '' && inputs.apk-path != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.apk-artifact-name }}
          path: ${{ inputs.release-build && 'release-apk/*.apk' || inputs.apk-path }}
          retention-days: ${{ inputs.apk-retention-days }}
          if-no-files-found: error

      # Logs are only kept when the build fails — a green build needs no verbose
      # trace, and keeping logs off the success path shrinks the public artifact
      # surface (build logs can carry dependency/SDK/environment detail).
      - name: Upload build log
        if: failure() && inputs.log-artifact-name != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.log-artifact-name }}
          path: build-log.txt
          retention-days: ${{ inputs.log-retention-days }}
          if-no-files-found: warn

      - name: Upload Gradle log
        if: failure() && inputs.gradle-tasks != ''
        uses: actions/upload-artifact@v4
        with:
          name: build_log_gradle.log
          path: build_log_gradle.log
          retention-days: 7
          if-no-files-found: warn
