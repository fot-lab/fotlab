# Composite action: run ONE parallel smoke shard against a prebuilt docker-android
# emulator.
#
# smoke_emulator.yaml splits the instrumented suite into four independent shards
# (test_app_smoke / test_image_loader / test_image_develop / test_image_alchemy),
# each a separate job that invokes this action with its own AndroidJUnitRunner
# `-e class` filter. The emulator is NO LONGER self-built or cached: this action
# starts the prebuilt `halimqarroum/docker-android` image as a Docker container,
# exposes its adbd on 127.0.0.1:5555, waits for boot, and runs the slice against
# it. The RAW corpus is warmed ONCE by the workflow's prep job; every shard
# restores it and only pays for its own emulator boot and test slice.
#
# The action deliberately contains NO cache-save step: only the prep job writes
# caches, so N parallel shards can never race to save the same key. The emulator
# is a pulled image, not a cache entry — it never needs saving.

name: Emulator smoke shard
description: Start a docker-android emulator and run one filtered slice of the instrumented smoke tests.

inputs:
  emulator-image:
    description: >-
      Prebuilt Android-emulator Docker image to boot. The image fixes the API level / ABI,
      so there is no separate api-level input. Default is OUR GitHub Container Registry build
      (ghcr.io/fot-lab/docker-android:api-33), published by .github/workflows/docker-android.yaml.
    required: false
    default: ghcr.io/fot-lab/docker-android:api-33
  native-artifact-name:
    description: Native artifact (librawler_fotlab.so + Kotlin bindings) to place; empty skips it.
    required: false
    default: ''
  shard:
    description: Shard id (app / loader / develop / alchemy) — used in the log artifact name.
    required: true
  test-filter:
    description: Comma-separated AndroidJUnitRunner -e class list this shard runs.
    required: true
  expected-tests:
    description: >-
      How many tests that filter must select. run_smoke_shard.sh fails the job when the count
      AGP reports differs, because an unparseable selector (e.g. `Class#m1+m2`) silently selects
      zero tests and still ends in BUILD SUCCESSFUL. Empty disables the check.
    required: false
    default: ''
  need-raw:
    description: Whether to restore and push the RAW corpus ('true'/'false').
    required: false
    default: 'false'
  need-lut:
    description: Whether to download and stage the grade LUT cube ('true'/'false').
    required: false
    default: 'false'
  demosaiced-cache:
    description: >-
      Phase-1 mode of the two-phase demosaiced-cache protocol: 'on' (default) runs the shard with
      the second-layer cache enabled (the app default) and lets run_smoke_shard.sh judge an OOM
      process crash by the RAW-journey floor, re-running with the cache OFF when below it. 'off'
      runs cache-off directly (no protocol).
    required: false
    default: 'on'
  raw-journey-tests:
    description: >-
      Comma-separated Class#method list of the shard's RAW-format journey tests, used to count
      successes for the cache-ON floor (2 = an OOM-crashed cache-ON run still validates the cache
      path and passes). Empty disables the protocol (shards without RAW journeys).
    required: false
    default: ''
  test-timeout-minutes:
    description: Timeout for the instrumented-test step (governed also by the job's timeout-minutes).
    required: false
    default: '45'
  log-artifact-name:
    description: Base name of the uploaded failure log artifact; empty means no upload.
    required: false
    default: ''
  log-retention-days:
    description: Retention of the failure log artifact, in days.
    required: false
    default: '7'

runs:
  using: composite
  # NOTE: composite actions do NOT accept an `env:` map here (the runner's
  # schema rejects the whole runs block). The constants below live on the
  # steps that consume them.
  steps:
    - name: Check out
      uses: actions/checkout@v7

    - name: Install JDK
      uses: ./.github/actions/install_jdk
      with:
        java-version: '17'
        distribution: temurin

    - name: Locate Android SDK
      uses: ./.github/actions/locate_sdk

    - name: Install Android SDK
      uses: ./.github/actions/install_sdk
      with:
        android-home: ${{ env.ANDROID_HOME }}
        api-level: ${{ env.ANDROID_API }}
        build-tools: ${{ env.ANDROID_BUILD_TOOLS }}
      env:
        # Needed to compile the debug APK (compileSdk/targetSdk 36). The emulator
        # itself lives in the docker-android container, so no system-images /
        # emulator packages are installed here.
        ANDROID_API: '36'
        ANDROID_BUILD_TOOLS: '36.0.0'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v5
      with:
        gradle-version: '8.14.5'
        validate-wrappers: false

    # -------- native (rawler_fotlab) — same placement as build_gradle.yaml --------
    - name: Download native artifact (rawler_fotlab)
      if: inputs.native-artifact-name != ''
      uses: actions/download-artifact@v7
      with:
        name: ${{ inputs.native-artifact-name }}
        path: native-artifacts

    - name: Place native libs + Kotlin bindings
      if: inputs.native-artifact-name != ''
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p app/build/generated/jniLibs
        cp -r native-artifacts/jniLibs/* app/build/generated/jniLibs/
        mkdir -p app/build/generated/uniffi/main/kotlin
        cp -r native-artifacts/kotlin/. app/build/generated/uniffi/main/kotlin/

    # -------- RAW corpus (warmed by prep; shards only restore) --------
    - name: Restore RAW sample cache
      if: inputs.need-raw == 'true'
      uses: actions/cache/restore@v6
      with:
        path: raw-samples
        key: rawdb-samples-v1

    # -------- Grade LUT fixture (small; alchemy shard only, no cache) --------
    - name: Download V-Log grade LUT cube
      if: inputs.need-lut == 'true'
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p lut-samples
        base="https://github.com/fot-lab/V-Log-Alchemy/raw/refs/heads/main"
        curl -fL --retry 3 --retry-delay 5 \
          -o "lut-samples/FLog2C_to_CLASSIC-Neg_VLog.cube" \
          "$base/Luts/Fujifilm/FLog2C_to_CLASSIC-Neg_VLog.cube"
        echo "3e2da957fc86cbe06d382ec68ae653df7a70d2de577d521c829b48d7c5a37d02  lut-samples/FLog2C_to_CLASSIC-Neg_VLog.cube" | sha256sum -c -
        ls -l lut-samples

    # -------- emulator: boot the prebuilt docker-android image --------
    # Replaces the old self-built AVD + emulator cache. The image auto-boots the
    # emulator on container start (google_apis / x86_64 / headless, -gpu
    # swiftshader_indirect). KVM acceleration is passed through with --device
    # /dev/kvm; the emulator runs as root inside the container, so the host-side
    # udev rule we used for a runner-local emulator is no longer needed. adbd is
    # exposed on 5555 (SKIP_AUTH=true removes the adb-key handshake), and we
    # publish ANDROID_SERIAL so the later `adb` calls in run_smoke_shard.sh target
    # exactly this device.
    # The emulator image (ghcr.io/fot-lab/docker-android:api-33) is published PUBLIC,
    # so the smoke shards pull it anonymously — no `docker login` and no token passthrough.
    # We deliberately keep GITHUB_TOKEN out of this composite action: composite actions
    # cannot read the `secrets` context (and a token passed in as an input is a needless
    # security liability that a public image makes unnecessary).
    - name: Start docker-android emulator
      shell: bash
      env:
        EMULATOR_IMAGE: ${{ inputs.emulator-image }}
      run: |
        set -euo pipefail
        export PATH="$ANDROID_HOME/platform-tools:$PATH"
        command -v adb >/dev/null 2>&1 || {
          echo "::error::adb not found on PATH after prepending $ANDROID_HOME/platform-tools"
          exit 1
        }
        echo "ANDROID_SERIAL=127.0.0.1:5555" >> "$GITHUB_ENV"

        echo "Booting Android emulator from $EMULATOR_IMAGE ..."
        # --privileged matches the image's own docker-compose: the bundled qemu
        # needs more than the KVM node to initialize (kernel capabilities / /dev
        # access). With only --device /dev/kvm the emulator process died at once,
        # `docker logs` stayed empty and adbd never came up.
        # EXTRA_FLAGS deliberately omits -partition-size: the image README still
        # advertises "-partition-size=8192" in its default EXTRA_FLAGS, but the
        # emulator bundled in the current :api-33 image (36.5.11.0) rejects it
        # ("unknown option: -partition-size=8192"), which makes the emulator exit
        # immediately and leaves adbd unreachable. Keep only flags every version
        # accepts.
        docker run -d --name fotlab-emu --privileged --device /dev/kvm \
          -p 127.0.0.1:5554:5554 \
          -p 127.0.0.1:5555:5555 \
          -e MEMORY=8192 -e CORES=4 -e SKIP_AUTH=true \
          -e EXTRA_FLAGS="-no-metrics -no-audio" \
          "$EMULATOR_IMAGE"

        # Sanity: KVM must be present for hardware-accelerated boot. Without it
        # the image falls back to TCG and the boot will not finish in time.
        if [ ! -e /dev/kvm ]; then
          echo "::warning::/dev/kvm missing on this runner — the emulator will fall back to TCG and likely time out."
        else
          ls -l /dev/kvm
        fi

        # Wait for the container's adbd to accept connections, then for boot.
        # NOTE: the adb getprop calls are EXPECTED to fail while the emulator is
        # still booting (device not yet connectable). Under `set -euo pipefail`
        # an unguarded `adb … | tr` would make the pipeline non-zero and abort
        # the whole step on the first poll — so each is wrapped in `{ … || true; }`
        # to keep the failure non-fatal while `tr` still strips the CR.
        adb connect 127.0.0.1:5555 || true
        boot_polls=0
        while [ "$boot_polls" -lt 90 ]; do
          st="$( { adb -s 127.0.0.1:5555 shell getprop sys.boot_completed 2>/dev/null || true; } | tr -d '\r' )"
          [ "$st" = "1" ] && break
          adb connect 127.0.0.1:5555 >/dev/null 2>&1 || true
          sleep 5
          boot_polls=$((boot_polls + 1))
        done
        final="$( { adb -s 127.0.0.1:5555 shell getprop sys.boot_completed 2>/dev/null || true; } | tr -d '\r' )"
        if [ "$final" != "1" ]; then
          echo "::error::Emulator did not finish booting within the 450s window."
          echo "--- container state ---"
          docker ps -a --filter name=fotlab-emu || true
          docker inspect -f 'status={{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} err={{.State.Error}}' fotlab-emu || true
          echo "--- container logs ---"
          docker logs fotlab-emu || true
          exit 1
        fi
        echo "Emulator booted and reachable at 127.0.0.1:5555."

    # -------- the filtered instrumented shard --------
    - name: Run ${{ inputs.shard }} smoke shard
      shell: bash
      env:
        SMOKE_TEST_FILTER: ${{ inputs.test-filter }}
        SHARD_ID: ${{ inputs.shard }}
        EXPECTED_TESTS: ${{ inputs.expected-tests }}
        NEED_RAW: ${{ inputs.need-raw }}
        NEED_LUT: ${{ inputs.need-lut }}
        DEMOSAICED_CACHE: ${{ inputs.demosaiced-cache }}
        RAW_JOURNEY_TESTS: ${{ inputs.raw-journey-tests }}
        TEST_TIMEOUT_MIN: ${{ inputs.test-timeout-minutes }}
      run: |
        set -euo pipefail
        export PATH="$ANDROID_HOME/platform-tools:$PATH"
        # Single-line script on purpose. The composite-action layer collapses a
        # multiline `script:` input into one line before handing it to a nested
        # action; with inline `#` comments that turns the rest of the code (incl.
        # the `fi` closing the guards) into an end-of-line comment. Calling a real
        # file keeps the newlines and comments intact. POSIX sh only (dash on
        # ubuntu): no PIPESTATUS / pipefail. See smoke_emulator.yaml for the
        # logcat/tombstone rationale (rawler FFI SIGSEGV/SIGABRT backtraces).
        # `timeout` mirrors the job-level budget for this step; the script exits
        # with the Gradle status (or a non-zero selector-check status).
        timeout "${TEST_TIMEOUT_MIN}m" bash .github/scripts/run_smoke_shard.sh

    # -------- emulator teardown (always, even on failure) --------
    - name: Stop docker-android emulator
      if: always()
      shell: bash
      run: |
        docker stop fotlab-emu >/dev/null 2>&1 || true
        docker rm -f fotlab-emu >/dev/null 2>&1 || true

    # -------- artifact filename sanitizer --------
    # ANDROID_SERIAL is 127.0.0.1:5555, so AGP writes the connected-test
    # profiling artifact as "127.0.0.1:5555_profile.pb". upload-artifact rejects
    # ':' in any path component (NTFS-incompatible), which fails the whole
    # upload and masks the real failure. Rename any such file to '_' first.
    - name: Sanitize connected-test artifact filenames
      if: failure()
      shell: bash
      run: |
        set -uo pipefail
        while IFS= read -r -d '' f; do
          nf="$(printf '%s' "$f" | tr ':' '_')"
          mv -- "$f" "$nf" && echo "renamed: $f -> $nf" || true
        done < <(find app/build/outputs/androidTest-results app/build/reports/androidTests -type f -name '*:*' -print0 2>/dev/null)
        true

    # Per-shard diagnostics: build-smoke-<shard>.log on the calling workflow.
    - name: Upload ${{ inputs.shard }} smoke logs
      if: failure() && inputs.log-artifact-name != ''
      uses: actions/upload-artifact@v7
      with:
        name: ${{ format('{0}-{1}', inputs.log-artifact-name, inputs.shard) }}
        path: |
          smoke-log.txt
          smoke-log-cacheon.txt
          logcat.txt
          tombstones.txt
          app/build/reports/androidTests/connected
          app/build/outputs/androidTest-results/connected
        retention-days: ${{ inputs.log-retention-days }}
        if-no-files-found: warn
