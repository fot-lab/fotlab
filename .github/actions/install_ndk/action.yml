# Composite action: ensure an NDK matching the pinned MAJOR version exists on
# the caller's runner.
#
# Preinstalled-first, matched by MAJOR version: the GitHub-hosted ubuntu-26.04
# image ships a moving set of NDKs (e.g. 27.3 / 28.2.13676358 / 29.0) and both
# the exact patch build and the set itself drift between image refreshes. We
# therefore accept ANY preinstalled NDK whose directory name starts with the
# pinned major (28 -> 28.2.13676358, 28.3.x, ...): cargo-ndk only cares about
# the major, so a preinstalled 28.x is used directly and never re-downloaded.
#
# When NO matching major is preinstalled, we fall back to sdkmanager and install
# the LATEST ndk;<major>.* available in the repository — we NEVER pin an exact
# patch build in configuration. The exact patch is resolved at install time and
# only lives in the resolved ndk-path output, so a future 28.x refresh is picked
# up automatically with no config change.
#
# The action emits the RESOLVED ndk directory (ndk-path / NDK_PATH) so the caller
# builds against whatever was actually selected (never a hardcoded exact version,
# which would not exist when a preinstalled or newer 28.x was chosen).
#
# Diagnostics: every step echoes its resolved inputs and the actual on-disk
# state, so a failed run shows exactly which runner image/architecture it landed
# on, what NDKs that image preinstalled, whether sdkmanager was reachable, and
# the final installed revision. This is what makes the preinstall-drift
# flakiness (ubuntu-26.04 is a floating label across image builds) debuggable
# instead of a silent exit 1.

name: Install Android NDK
description: Ensure an NDK matching the pinned major version exists (prefer runner preinstall, else install latest <major>.x via sdkmanager).

inputs:
  android-home:
    description: ANDROID_HOME path the NDK lives in.
    required: true
  ndk-version:
    description: NDK MAJOR version to match/install, e.g. 28 (never an exact patch build).
    required: true

outputs:
  need-install:
    description: Whether the NDK had to be installed (false = a preinstalled major match was used).
    value: ${{ steps.precheck.outputs.need-install }}
  ndk-path:
    description: Absolute path to the NDK directory to use (preinstalled major match, or the latest installed <major>.x).
    value: ${{ steps.publish.outputs.ndk-path }}

runs:
  using: 'composite'
  steps:
    - name: Check preinstalled NDK
      id: precheck
      shell: bash
      env:
        ANDROID_HOME: ${{ inputs.android-home }}
        NDK_VERSION: ${{ inputs.ndk-version }}
      run: |
        set -euo pipefail
        NDK_MAJOR="${NDK_VERSION%%.*}"
        echo "== Check preinstalled NDK =="
        echo "  ANDROID_HOME = $ANDROID_HOME"
        echo "  NDK_VERSION  = $NDK_VERSION (major match key; exact patch never pinned)"
        echo "  NDK_MAJOR    = $NDK_MAJOR"
        echo "  ImageOS      = ${ImageOS:-<unset>}"
        echo "  RUNNER_ARCH  = ${RUNNER_ARCH:-<unset>}"
        echo "  NDKs present under $ANDROID_HOME/ndk/:"
        if [ -d "$ANDROID_HOME/ndk" ]; then
          ls -1 "$ANDROID_HOME/ndk" 2>/dev/null | sed 's/^/    - /' || true
          [ -n "$(ls -1 "$ANDROID_HOME/ndk" 2>/dev/null)" ] || echo "    (ndk/ is empty)"
        else
          echo "    (ndk/ directory does not exist at $ANDROID_HOME)"
        fi

        # Accept ANY preinstalled dir whose name starts with the pinned major
        # (e.g. 28.2.13676358 or 28.3.x both satisfy major 28). source.properties
        # is written by every sdkmanager NDK install and is what AGP probes.
        PRE=""
        if [ -d "$ANDROID_HOME/ndk" ]; then
          for d in $(ls -1 "$ANDROID_HOME/ndk" 2>/dev/null | sort); do
            case "$d" in
              "$NDK_MAJOR"*)
                if [ -f "$ANDROID_HOME/ndk/$d/source.properties" ]; then PRE="$d"; break; fi
                ;;
            esac
          done
        fi

        if [ -n "$PRE" ]; then
          echo "  => Preinstalled NDK '$PRE' matches major $NDK_MAJOR at $ANDROID_HOME/ndk/$PRE — nothing to install."
          echo "need-install=false" >> "$GITHUB_OUTPUT"
          echo "NDK_PATH=$ANDROID_HOME/ndk/$PRE" >> "$GITHUB_ENV"
        else
          echo "  => No NDK with major $NDK_MAJOR preinstalled — will install latest $NDK_MAJOR.x via sdkmanager."
          echo "need-install=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Resolve latest NDK (fallback)
      id: resolve
      if: steps.precheck.outputs.need-install == 'true'
      shell: bash
      env:
        ANDROID_HOME: ${{ inputs.android-home }}
        ANDROID_SDK_ROOT: ${{ inputs.android-home }}
        NDK_VERSION: ${{ inputs.ndk-version }}
      run: |
        set -euo pipefail
        echo "== Resolve latest NDK (fallback) =="
        echo "  ANDROID_HOME     = $ANDROID_HOME"
        echo "  ANDROID_SDK_ROOT = $ANDROID_SDK_ROOT"
        echo "  NDK_VERSION      = $NDK_VERSION (major)"

        # Probe 1 — direct PATH lookup. install_sdk (setup-android) is expected
        # to have exported sdkmanager's cmdline-tools dir to PATH. A miss is NOT
        # fatal: captured with `|| true` so the filesystem fallback still runs.
        SDKMANAGER="$(command -v sdkmanager || true)"
        if [ -z "$SDKMANAGER" ]; then
          echo "::warning::sdkmanager not on PATH — probing cmdline-tools locations."
          echo "  PATH=$PATH"
          CANDIDATES=(
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            "$ANDROID_HOME/cmdline-tools/bin/sdkmanager"
          )
          for p in "${CANDIDATES[@]}"; do
            if [ -x "$p" ]; then SDKMANAGER="$p"; break; fi
          done
        fi
        if [ -z "$SDKMANAGER" ]; then
          FOUND="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -name sdkmanager -type f 2>/dev/null | head -n1 || true)"
          [ -n "$FOUND" ] && SDKMANAGER="$FOUND"
        fi
        if [ -z "$SDKMANAGER" ]; then
          echo "::error::sdkmanager not found on PATH nor under $ANDROID_HOME/cmdline-tools. install_sdk must run before install_ndk and provide cmdline-tools."
          exit 1
        fi
        echo "  sdkmanager (resolved): $SDKMANAGER"
        "$SDKMANAGER" --version 2>&1 | sed 's/^/    /' || true

        # Pick the LATEST ndk;<major>.* available — never pin an exact patch.
        NDK_MAJOR="${NDK_VERSION%%.*}"
        echo "  Resolving latest ndk;$NDK_MAJOR.* from repository..."
        AVAIL="$($SDKMANAGER --list 2>/dev/null | grep -oE "ndk;${NDK_MAJOR}\.[0-9.]+" | sort -V -u | tail -n1 || true)"
        if [ -z "$AVAIL" ]; then
          echo "::error::no ndk;$NDK_MAJOR.* package found in sdkmanager repository."
          exit 1
        fi
        SDK_VER="${AVAIL#ndk;}"
        echo "  Resolved install package: $AVAIL (version $SDK_VER)"
        echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
        echo "NDK_INSTALL_VER=$SDK_VER" >> "$GITHUB_ENV"
        echo "NDK_PATH=$ANDROID_HOME/ndk/$SDK_VER" >> "$GITHUB_ENV"

    - name: Cache Android NDK
      if: steps.precheck.outputs.need-install == 'true'
      uses: actions/cache@v6
      with:
        path: ${{ env.NDK_PATH }}
        key: ${{ runner.os }}-ndk-${{ env.NDK_INSTALL_VER }}
        restore-keys: |
          ${{ runner.os }}-ndk-

    - name: Install NDK
      if: steps.precheck.outputs.need-install == 'true'
      shell: bash
      env:
        ANDROID_HOME: ${{ inputs.android-home }}
        ANDROID_SDK_ROOT: ${{ inputs.android-home }}
        SDKMANAGER: ${{ env.SDKMANAGER }}
        NDK_INSTALL_VER: ${{ env.NDK_INSTALL_VER }}
      run: |
        set -euo pipefail
        echo "== Install NDK (fallback) =="
        echo "  sdkmanager        = $SDKMANAGER"
        echo "  NDK_INSTALL_VER   = $NDK_INSTALL_VER"
        echo "  Target dir        = $ANDROID_HOME/ndk/$NDK_INSTALL_VER"
        echo "  Accepting SDK licenses..."
        yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
        echo "  Installing ndk;$NDK_INSTALL_VER ..."
        if ! "$SDKMANAGER" --install "ndk;$NDK_INSTALL_VER"; then
          echo "::error::sdkmanager --install ndk;$NDK_INSTALL_VER failed (see sdkmanager output above)."
          exit 1
        fi
        echo "  sdkmanager install finished."

    - name: Verify NDK
      shell: bash
      env:
        ANDROID_HOME: ${{ inputs.android-home }}
        NDK_VERSION: ${{ inputs.ndk-version }}
        NDK_PATH: ${{ env.NDK_PATH }}
      run: |
        set -euo pipefail
        echo "== Verify NDK =="
        NDK_DIR="${NDK_PATH:-$ANDROID_HOME/ndk/$NDK_VERSION}"
        if [ ! -f "$NDK_DIR/source.properties" ]; then
          echo "::error::NDK missing at $NDK_DIR (preinstall absent and install fallback did not provide it)"
          exit 1
        fi
        REV="$(grep -m1 '^Pkg.Revision' "$NDK_DIR/source.properties" 2>/dev/null | cut -d= -f2- | tr -d '[:space:]' || true)"
        echo "  NDK verified: $NDK_DIR (Pkg.Revision=${REV:-unknown})"

    - name: Publish NDK path
      id: publish
      shell: bash
      run: |
        set -euo pipefail
        echo "ndk-path=${NDK_PATH:-}" >> "$GITHUB_OUTPUT"
        echo "== Publish NDK path =="
        echo "  ndk-path = ${NDK_PATH:-<unset>}"
